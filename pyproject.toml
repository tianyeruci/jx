[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jx-now-ai-management"
version = "0.2.1"
description = "Small modular AI management service for Dify 1.13.3"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "pydantic-settings>=2.6,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "redis>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.41,<2",
]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "streamlit>=1.41,<2",
]
ocr = [
  "rapidocr==3.9.2",
  "onnxruntime==1.28.0",
  "pypdfium2==5.12.1",
  "rapid-layout==1.2.1",
  "rapid-table==3.0.2",
]

[project.scripts]
ai-management = "ai_management.main:run"
ai-course-import = "ai_management.cli:main"
ai-rag-eval = "ai_management.rag_eval:main"

[tool.setuptools.packages.find]
include = ["ai_management*", "knowledge_cleaner*"]

[tool.setuptools]
py-modules = ["dify_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Other/event_rag_cleaner/.pytest-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
