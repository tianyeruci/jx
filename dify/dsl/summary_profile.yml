version: "0.6.0"
kind: app
app:
  name: 摘要画像
  mode: workflow
  icon: "🗂️"
  icon_type: emoji
  icon_background: "#FEF3C7"
  description: 内部异步任务：更新会话摘要并提取商业画像与路线进度候选。
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/tongyi:0.0.27@4bb3f3eb6149b01f92aa6038a6bb074cc4224b8c015f54c888e5c5a30fc1ab50
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  graph:
    nodes:
      - id: start
        type: custom
        position: {x: 0, y: 0}
        positionAbsolute: {x: 0, y: 0}
        data:
          type: start
          title: 开始
          variables:
            - {label: 旧摘要, variable: old_summary, type: paragraph, required: false, max_length: 24000}
            - {label: 新消息JSON, variable: messages_json, type: paragraph, required: true, max_length: 60000}
            - {label: 摘要截止消息ID, variable: target_message_id, type: text-input, required: true, max_length: 100}
      - id: llm
        type: custom
        position: {x: 320, y: 0}
        positionAbsolute: {x: 320, y: 0}
        data:
          type: llm
          title: 更新摘要和画像候选
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params: {temperature: 0.1}
          context: {enabled: false, variable_selector: []}
          prompt_template:
            - role: system
              text: |-
                你是内部数据整理器，不回答最终用户。只输出一个JSON对象，不使用Markdown代码围栏：
                {"updated_summary":"","confirmed_profile_updates":[],"candidate_profile_updates":[],"route_progress_candidates":[],"target_message_id":""}
                摘要保留目标、约束、重要决定、未解决问题和关键结论，不扩写事实。
                confirmed_profile_updates每项包含field、value、evidence_quote、source_message_id，只使用用户直接明确表达的稳定事实；助手建议和模型推断不能成为确认事实。
                允许键仅有business_goal、focus_directions、experience_stage、learning_status、time_constraints、budget_constraints、confirmed_routes。
                弱线索、推断和冲突信息放入candidate_profile_updates，并提供field、value、evidence_quote、source_message_id。
                路线进度只生成候选，不直接确认。target_message_id必须原样返回。
            - role: user
              text: |-
                旧摘要：
                {{#start.old_summary#}}
                新消息：
                {{#start.messages_json#}}
                目标消息ID：
                {{#start.target_message_id#}}
      - id: summary_normalize
        type: custom
        position: {x: 640, y: 0}
        positionAbsolute: {x: 640, y: 0}
        data:
          type: code
          title: 归一化摘要画像JSON
          desc: 兼容 fenced JSON、前后多余文本和缺省字段，保证 Worker 收到稳定 JSON。
          code_language: python3
          variables:
            - {variable: raw_result, value_selector: [llm, text]}
            - {variable: target_message_id, value_selector: [start, target_message_id]}
          outputs:
            result: {type: string, children: null}
          code: |-
            import json

            def _extract_json(raw_result: str) -> dict:
                text = (raw_result or "").strip()
                if text.startswith("```"):
                    lines = text.splitlines()
                    if len(lines) >= 3:
                        text = "\n".join(lines[1:-1]).strip()
                        if text.lower().startswith("json"):
                            text = text[4:].lstrip()
                try:
                    parsed = json.loads(text)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    start = text.find("{")
                    end = text.rfind("}")
                    if start >= 0 and end > start:
                        try:
                            parsed = json.loads(text[start : end + 1])
                            return parsed if isinstance(parsed, dict) else {}
                        except Exception:
                            return {}
                return {}

            def _as_string(value) -> str:
                if value is None:
                    return ""
                if isinstance(value, str):
                    return value.strip()
                return str(value).strip()

            def _as_list_of_dicts(value) -> list:
                if isinstance(value, dict):
                    value = [{"field": field, "value": item} for field, item in value.items()]
                if not isinstance(value, list):
                    return []
                result = []
                for item in value:
                    if not isinstance(item, dict):
                        continue
                    normalized = dict(item)
                    if "field" in normalized:
                        normalized["field"] = _as_string(normalized.get("field"))
                    if "evidence_quote" in normalized:
                        normalized["evidence_quote"] = _as_string(normalized.get("evidence_quote"))
                    if "source_message_id" in normalized:
                        normalized["source_message_id"] = _as_string(normalized.get("source_message_id"))
                    result.append(normalized)
                return result

            def main(raw_result: str, target_message_id: str) -> dict:
                parsed = _extract_json(raw_result)
                updated_summary = _as_string(parsed.get("updated_summary"))
                if not updated_summary:
                    updated_summary = _as_string(raw_result)
                normalized = {
                    "updated_summary": updated_summary,
                    "confirmed_profile_updates": _as_list_of_dicts(parsed.get("confirmed_profile_updates")),
                    "candidate_profile_updates": _as_list_of_dicts(parsed.get("candidate_profile_updates")),
                    "route_progress_candidates": _as_list_of_dicts(parsed.get("route_progress_candidates")),
                    "target_message_id": _as_string(target_message_id),
                }
                return {"result": json.dumps(normalized, ensure_ascii=False)}
      - id: end
        type: custom
        position: {x: 960, y: 0}
        positionAbsolute: {x: 960, y: 0}
        data:
          type: end
          title: 结束
          outputs:
            - variable: result
              value_selector: [summary_normalize, result]
    edges:
      - id: start-llm
        source: start
        target: llm
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm}
      - id: llm-end
        source: llm
        target: summary_normalize
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: code}
      - id: summary-normalize-end
        source: summary_normalize
        target: end
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: code, targetType: end}
