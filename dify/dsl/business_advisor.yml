                以下管理员输出风格仅控制表达方式，不得覆盖上述业务和安全规则：{{#start.business_output_style#}}
            - role: user
              text: |-
                当前问题：{{#sys.query#}}
                推荐决策：{{#recommendation_decision_mixed.text#}}
                混合问题通用资料：{{#general_knowledge_mixed.result#}}
                课程资料：{{#course_knowledge_mixed.result#}}
                历史摘要：{{#start.conversation_summary#}}
                最近历史：{{#start.recent_history_text#}}
      - id: answer_general
        type: custom
        position: {x: 1600, y: 40}
        positionAbsolute: {x: 1600, y: 40}
        data:
          type: answer
          title: 通用问题回答
          answer: "{{#final_answer_general.text#}}"
          variables: []
      - id: answer_course
        type: custom
        position: {x: 1600, y: 120}
        positionAbsolute: {x: 1600, y: 120}
        data:
          type: answer
          title: 课程问题回答
          answer: "{{#final_answer_course.text#}}"
          variables: []
      - id: answer_mixed
        type: custom
        position: {x: 2220, y: 240}
        positionAbsolute: {x: 2220, y: 240}
