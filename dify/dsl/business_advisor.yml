                推荐决策：{{#recommendation_decision_course.text#}}
                课程资料：{{#course_knowledge.result#}}
                历史摘要：{{#start.conversation_summary#}}
                最近历史：{{#start.recent_history_text#}}
      - id: final_answer_mixed
        type: custom
        position: {x: 1900, y: 240}
        positionAbsolute: {x: 1900, y: 240}
        data:
          type: llm
          title: 混合问题最终回答
          desc: 混合问题分支的正文不输出正式链接、卡片或自行编写的官方路线。
          model:
            provider: langgenius/tongyi/tongyi
