version: "0.6.0"
kind: app
app:
  name: 商业顾问
  mode: advanced-chat
  icon: "🧭"
  icon_type: emoji
  icon_background: "#E4FBCC"
  description: 商业知识问答、审核课程推荐和学习路线建议。
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/tongyi:0.0.27@4bb3f3eb6149b01f92aa6038a6bb074cc4224b8c015f54c888e5c5a30fc1ab50
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      number_limits: 0
    opening_statement: 你好，我可以回答商业问题，也可以根据你的明确需求推荐已审核课程或学习路线。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 我想系统学习AI工具，应该从哪里开始？
      - 有没有适合公众号运营入门的课程？
      - 我有一个具体的商业问题，如何分析？
      - 我是新手，应该先学习哪些课程？
      - 我已经有一些基础，如何选择进阶课程？
      - 课程应该按什么顺序学习？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    nodes:
      - id: start
        type: custom
        position: {x: 0, y: 120}
        positionAbsolute: {x: 0, y: 120}
        data:
          type: start
          title: 开始
          desc: AI管理服务每轮注入本地摘要、最近历史、画像和路线进度。
          variables:
            - {label: 本地会话ID, variable: local_conversation_id, type: text-input, required: true, max_length: 100}
            - {label: 历史摘要, variable: conversation_summary, type: paragraph, required: false, max_length: 12000}
            - {label: 最近对话, variable: recent_history_text, type: paragraph, required: false, max_length: 24000}
            - {label: 用户画像JSON, variable: profile_json, type: paragraph, required: false, max_length: 12000}
            - {label: 路线进度JSON, variable: route_progress_json, type: paragraph, required: false, max_length: 12000}
            - {label: 商业回答输出风格, variable: business_output_style, type: paragraph, required: false, max_length: 4000}
            - {label: 专家见解输出风格, variable: expert_insight_style, type: paragraph, required: false, max_length: 4000}
      - id: question_split
        type: custom
        position: {x: 300, y: 240}
        positionAbsolute: {x: 300, y: 240}
        data:
          type: llm
          title: 问题结构化拆分
          desc: 输出两个可独立检索的子问题；失败时由后续代码回退双检索。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params:
              temperature: 0
          context: {enabled: false, variable_selector: []}
          prompt_template:
            - role: system
              text: |-
                只输出一个严格JSON对象，不使用Markdown。把用户问题拆成可独立检索的子问题：
                {"general_query":"","course_query":"","question_type":"general|course|mixed"}
                通用商业知识填general_query；课程、课程路线、课程适合谁、课程内容填course_query。普通问题只填general_query，明确课程问题只填course_query，混合问题两个都填。不要编造信息。
            - role: user
              text: "{{#sys.query#}}"
      - id: query_split_normalize
        type: custom
        position: {x: 600, y: 240}
        positionAbsolute: {x: 600, y: 240}
        data:
          type: code
          title: 解析并兜底问题拆分
          desc: 解析失败时使用原问题分别检索，保证不返回空回答。
          code_language: python3
          variables:
            - {variable: split_json, value_selector: [question_split, text]}
            - {variable: original_query, value_selector: [sys, query]}
          outputs:
            general_query: {type: string, children: null}
            course_query: {type: string, children: null}
            question_type: {type: string, children: null}
            fallback_used: {type: string, children: null}
          code: |-
            import json

            def main(split_json: str, original_query: str) -> dict:
                try:
                    value = json.loads(split_json)
                    general = str(value.get("general_query") or "").strip()
                    course = str(value.get("course_query") or "").strip()
                    kind = str(value.get("question_type") or "").strip()
                    if kind not in {"general", "course", "mixed"}:
                        raise ValueError("invalid question_type")
                    if kind == "general" and not general:
                        raise ValueError("empty general query")
                    if kind == "course" and not course:
                        raise ValueError("empty course query")
                    if kind == "mixed" and (not general or not course):
                        raise ValueError("empty mixed query")
                    return {"general_query": general, "course_query": course, "question_type": kind, "fallback_used": "false"}
                except Exception:
                    return {"general_query": original_query, "course_query": original_query, "question_type": "mixed", "fallback_used": "true"}
      - id: question_classifier
        type: custom
        position: {x: 860, y: 240}
        positionAbsolute: {x: 860, y: 240}
        data:
          type: question-classifier
          title: 检索范围路由
          desc: 按通用、课程或混合问题控制需要执行的知识库检索。
          classes:
            - {id: general, name: 通用问题}
            - {id: course, name: 课程问题}
            - {id: mixed, name: 混合问题}
          instructions: "通用商业知识为general；明确查课程、课程路线或课程内容为course；同时包含通用商业问题和课程需求为mixed。"
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params: {temperature: 0}
          query_variable_selector: [query_split_normalize, question_type]
      - id: general_knowledge
        type: custom
        position: {x: 320, y: 40}
        positionAbsolute: {x: 320, y: 40}
        data:
          type: knowledge-retrieval
          title: 通用知识检索
          desc: 导入后在Dify控制台绑定 business-general-test。
          query_variable_selector: [query_split_normalize, general_query]
          dataset_ids: []
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 5
            score_threshold: 0.3
            reranking_enable: false
            reranking_mode: reranking_model
            reranking_model: {provider: "", model: ""}
      - id: course_knowledge
        type: custom
        position: {x: 640, y: 40}
        positionAbsolute: {x: 640, y: 40}
        data:
          type: knowledge-retrieval
          title: 课程路线检索
          desc: 导入后在Dify控制台绑定 business-course-test。
          query_variable_selector: [query_split_normalize, course_query]
          dataset_ids: []
          metadata_filtering_mode: manual
          metadata_filtering_conditions:
            logical_operator: and
            conditions:
              - {name: status, comparison_operator: is, value: active}
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 8
            score_threshold: 0.25
            reranking_enable: false
            reranking_mode: reranking_model
            reranking_model: {provider: "", model: ""}
      - id: general_knowledge_mixed
        type: custom
        position: {x: 960, y: 240}
        positionAbsolute: {x: 960, y: 240}
        data:
          type: knowledge-retrieval
          title: 混合问题通用知识检索
          desc: 仅在混合问题中执行，再进入课程知识检索。
          query_variable_selector: [query_split_normalize, general_query]
          dataset_ids: []
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 5
            score_threshold: 0.3
            reranking_enable: false
            reranking_mode: reranking_model
            reranking_model: {provider: "", model: ""}
      - id: course_knowledge_mixed
        type: custom
        position: {x: 1260, y: 240}
        positionAbsolute: {x: 1260, y: 240}
        data:
          type: knowledge-retrieval
          title: 混合问题课程路线检索
          desc: 仅在混合问题中执行，避免与课程问题分支共享未执行变量。
          query_variable_selector: [query_split_normalize, course_query]
          dataset_ids: []
          metadata_filtering_mode: manual
          metadata_filtering_conditions:
            logical_operator: and
            conditions:
              - {name: status, comparison_operator: is, value: active}
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 8
            score_threshold: 0.25
            reranking_enable: false
            reranking_mode: reranking_model
            reranking_model: {provider: "", model: ""}
      - id: recommendation_decision_general
        type: custom
        position: {x: 960, y: 40}
        positionAbsolute: {x: 960, y: 40}
        data:
          type: llm
          title: 通用问题推荐决策
          desc: 通用问题分支只输出决策JSON；无课程证据时不要编造课程或路线ID。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params:
              temperature: 0.1
          context:
            enabled: false
            variable_selector: []
          prompt_template:
            - role: system
              text: |-
                你是商业顾问的推荐决策器，不直接面向用户。只输出一个JSON对象，不使用Markdown代码围栏。
                结构：
                {"intent":"general_qa|direct_course|route_recommendation|clarification","candidate_course_ids":[],"candidate_route_id":"","missing_information":[],"clarification_question":"","answer_plan":"","expert_insight":"","progress_action":{"type":"none|confirm_route|confirm_current_stage|confirm_stage_completed","route_id":"","stage_id":"","evidence_quote":""}}
                课程、路线和阶段ID必须逐字来自课程或路线检索结果；当前分支没有这类证据时必须留空。不要输出链接。
                对通用问题，优先给出事实回答、分析框架或澄清问题，不要为了凑推荐而输出课程或路线。
                信息不足时最多询问两个会改变推荐结果的问题。
                只有当前用户明确选择路线时才使用confirm_route；明确确认所处阶段时才使用confirm_current_stage；明确确认当前阶段完成或跳过时才使用confirm_stage_completed。evidence_quote必须是当前问题中的连续原文。
            - role: user
              text: |-
                当前问题：
                {{#sys.query#}}

                已确认画像：
                {{#start.profile_json#}}

                已确认路线进度：
                {{#start.route_progress_json#}}

                会话摘要：
                {{#start.conversation_summary#}}

                最近未摘要历史：
                {{#start.recent_history_text#}}

                通用知识检索：
                {{#general_knowledge.result#}}

                expert_insight必须固定留空；不得基于课程模板虚构课程重点、课节、效果或专业见解。
      - id: recommendation_decision_course
        type: custom
        position: {x: 960, y: 120}
        positionAbsolute: {x: 960, y: 120}
        data:
          type: llm
          title: 课程问题推荐决策
          desc: 课程问题分支只输出决策JSON；候选ID必须来自课程检索结果。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params:
