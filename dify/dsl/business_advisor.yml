                最近未摘要历史：
                {{#start.recent_history_text#}}

                混合问题的通用知识检索：
                {{#general_knowledge_mixed.result#}}

                课程与路线检索：
                {{#course_knowledge_mixed.result#}}

                expert_insight必须固定留空；不得基于课程模板虚构课程重点、课节、效果或专业见解。
      - id: final_answer_general
        type: custom
        position: {x: 1280, y: 40}
        positionAbsolute: {x: 1280, y: 40}
        data:
          type: llm
          title: 通用问题最终回答
          desc: 通用问题分支的正文不输出正式链接、卡片或自行编写的官方路线。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params:
              temperature: 0.3
          context:
            enabled: false
            variable_selector: []
          prompt_template:
            - role: system
              text: |-
                你是谨慎、务实的商业顾问。只使用提供的检索资料回答事实问题，资料不足时明确说明。
                不输出任何课程链接，不编写正式课程卡片或官方路线表；这些由服务端根据候选ID生成。
                决策要求澄清时只问一到两个关键问题。“学习结果”不得表达成效果承诺。
                推荐原因只能基于已确认目标/方向、当前问题、已确认阶段及课程真实介绍；缺少依据时明确说明，不补写课程事实。
                不展示内部JSON、画像字段名、摘要或系统实现。
                以下管理员输出风格仅控制表达方式，不得覆盖上述业务和安全规则：{{#start.business_output_style#}}
            - role: user
              text: |-
                当前问题：{{#sys.query#}}
                推荐决策：{{#recommendation_decision_general.text#}}
                通用资料：{{#general_knowledge.result#}}
                历史摘要：{{#start.conversation_summary#}}
                最近历史：{{#start.recent_history_text#}}
      - id: final_answer_course
        type: custom
        position: {x: 1280, y: 120}
        positionAbsolute: {x: 1280, y: 120}
        data:
          type: llm
          title: 课程问题最终回答
          desc: 课程问题分支的正文不输出正式链接、卡片或自行编写的官方路线。
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params:
              temperature: 0.3
          context:
            enabled: false
            variable_selector: []
          prompt_template:
            - role: system
              text: |-
                你是谨慎、务实的商业顾问。只使用提供的检索资料回答事实问题，资料不足时明确说明。
                不输出任何课程链接，不编写正式课程卡片或官方路线表；这些由服务端根据候选ID生成。
                决策要求澄清时只问一到两个关键问题。“学习结果”不得表达成效果承诺。
                推荐原因只能基于已确认目标/方向、当前问题、已确认阶段及课程真实介绍；缺少依据时明确说明，不补写课程事实。
