version: "0.6.0"
kind: app
app:
  name: 朋友圈顾问
  mode: workflow
  icon: "💬"
  icon_type: emoji
  icon_background: "#E0F2FE"
  description: 单次无状态的朋友圈内容创作、改写和润色。
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/tongyi:0.0.27@4bb3f3eb6149b01f92aa6038a6bb074cc4224b8c015f54c888e5c5a30fc1ab50
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  graph:
    nodes:
      - id: start
        type: custom
        position: {x: 0, y: 0}
        positionAbsolute: {x: 0, y: 0}
        data:
          type: start
          title: 开始
          variables:
            - {label: 本次要求, variable: request, type: paragraph, required: true, max_length: 12000}
            - {label: 原始素材, variable: source_material, type: paragraph, required: false, max_length: 24000}
            - {label: 目标受众, variable: audience, type: text-input, required: false, max_length: 500}
            - {label: 语气, variable: tone, type: text-input, required: false, max_length: 500}
            - {label: 其他限制, variable: constraints, type: paragraph, required: false, max_length: 3000}
            - {label: 管理员输出风格, variable: admin_output_style, type: paragraph, required: false, max_length: 4000}
      - id: llm
        type: custom
        position: {x: 320, y: 0}
        positionAbsolute: {x: 320, y: 0}
        data:
          type: llm
          title: 生成朋友圈内容
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params: {temperature: 0.6}
          context: {enabled: false, variable_selector: []}
          prompt_template:
            - role: system
              text: |-
                你是朋友圈内容顾问。信息足够时直接交付，不虚构经历、客户评价、数字、收益或权威背书。
                如果用户明确指定内容类型，按用户指定；否则根据要求和素材自动判断最匹配的内容类型：生活记录、好评反馈、专业干货、产品推广或互动交流；无法明确判断时沿用通用写作规则，不强行分类。
                生活记录抓具体场景和真实感受；反馈表达感谢并提炼观察；专业干货讲清方法、步骤或判断依据；产品推广说明真实用途和适合人群；互动提出具体问题，邀请自然交流。
                用户明确的任务、素材、受众、字数、禁用词和其他限制优先，不被方法论默认值覆盖；管理员输出风格继续按现有配置优先级生效。商业宣传避免绝对化承诺、夸大结果和硬广，不把推测写成事实。
                当素材为空或只有主题时，不把主题扩写成具体事实；不得补写时间、地点、人物原话、产品功能、工具、流程步骤、数据、效果或结果，改用概括表达或明确占位符。
                request 和 source_material 中逐字明确提供的信息都可作为事实使用；主题、目标和写作要求本身不授权补造额外事实。若 request 只有主题和写作要求而没有原始素材，使用概括性文案，不添加具体细节。
                当 source_material 为空时仍可完成写作任务，但只能使用概括表达、占位符或用户明确给出的事实；不要为了让文案更具体而补写时间、地点、人物、原话、产品功能、工具、步骤、数据或结果。
                默认给一个自然、易读的主版本，避免模板腔和过量表情符号；发布前检查事实来源、用户限制、字数和绝对化表达。只输出给用户看的结果。
                管理员输出风格：{{#start.admin_output_style#}}
            - role: user
              text: |-
                要求：{{#start.request#}}
                素材：{{#start.source_material#}}
                受众：{{#start.audience#}}
                语气：{{#start.tone#}}
                限制：{{#start.constraints#}}
                重要补充：素材字段为空时，要求中的主题和写作目标不等于事实素材；请保持概括、克制，不补写未提供的具体细节。
      - id: end
        type: custom
        position: {x: 640, y: 0}
        positionAbsolute: {x: 640, y: 0}
        data:
          type: end
          title: 结束
          outputs:
            - variable: text
              value_selector: [llm, text]
    edges:
      - id: start-llm
        source: start
        target: llm
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm}
      - id: llm-end
        source: llm
        target: end
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end}
