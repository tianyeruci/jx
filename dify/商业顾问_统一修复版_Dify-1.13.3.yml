    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 一次模型调用完成活动、方案优化改写、案例和常见问题分类；活动类同时抽取时间模式、状态、语义主题和结构化筛选条件。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            max_tokens: 900
            temperature: 0
          mode: chat
          name: qwen-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: unified-intent-system
          role: system
          text: |-
            你是商业顾问的统一意图识别器。只输出一个合法 JSON 对象，不回答业务问题，不输出 Markdown、代码围栏或分析过程。

            一次完成两件事：
            1. 判断主意图；
            2. 生成该主意图真正用于检索的独立语义。活动类还必须拆解时间模式、状态、主题语义和明确筛选条件。

            输出结构：
            {
              "primary_intent": "activity|solution_optimization|faq",
              "faq_mode": "general|case|clarify；primary_intent 非 faq 时为空字符串",
              "retrieval_query": "solution_optimization/faq 用于知识库检索的独立语义问题；activity 可为空字符串",
              "activity": null
            }

            当 primary_intent=activity 时，activity 必须是：
            {
              "mode": "recent|all|normal|cancelled|postponed|completed|detail",
              "semantic_query": "用户真正关注的活动主题；没有主题限制时为空字符串",
              "name": "仅指定活动详情时填写具体活动名，否则为空字符串",
              "city": "明确城市，否则为空字符串",
              "delivery_mode": "online|offline|hybrid 或空字符串",
              "event_type": "课程|训练营|沙龙|圆桌会|私董会|直播|公开课|工作坊|峰会|论坛|分享会|交流会|会议 或空字符串",
              "topic": "仅当用户明确说出受控主题时填写，否则为空字符串",
              "industry": "仅当用户明确限制行业时填写，否则为空字符串",
              "business_stage": "初创期|成长期|成熟期|转型期 或空字符串",
              "need_links": false
            }

            主意图按用户正在要求完成的任务判断，不按单个词判断：
            - activity：查询真实可参加活动、会议、训练营、场次的列表、日期、状态、地点、报名或具体详情。
            - solution_optimization：优化、改写或设计产品、服务、营销活动方案、定价、权益、文案。比如“如何优化活动方案”不是活动列表。
            - faq：类别内再用 faq_mode 区分 general（其他商业常见问题、经营方法和知识问答）、case（明确索要真实、类似、相关咨询案例）和 clarify（无法从当前问题和历史唯一确定意图或具体活动名称）。“活动策划案例”属于 faq+case，不属于实际活动查询。
            混合问题选择当前主要任务，优先级为 solution_optimization > faq+case > activity > faq+general；明确索要“真实/类似/咨询案例”时，不能因为案例主题包含活动或会议就改判为 activity。

            非活动检索语义规则：
            - solution_optimization/faq 的 retrieval_query 必须非空，保留对象、目标和关键约束，去掉“帮我查一下”等无检索价值话术，但不能机械拆词或扩写虚构事实。
            - “如何优化活动方案” => primary_intent=solution_optimization，faq_mode=""，retrieval_query 应描述活动方案优化目标，不得进入活动列表。
            - “怎么策划一场私域获客活动” => primary_intent=solution_optimization，faq_mode=""，不得因为包含“活动”而进入 activity。
            - “如何提高活动报名转化率” => primary_intent=solution_optimization，faq_mode=""，不得进入真实活动检索。
            - “会议相关的真实咨询案例” => primary_intent=faq，faq_mode=case，retrieval_query 保留会议问题和案例约束。
            - faq_mode=clarify 只表示需要补充关键信息，不要猜测缺失的具体活动名称。

            活动拆解规则：
            - “最近有哪些活动” => mode=recent，semantic_query=""。
            - “最近有哪些关于GPT应用场景的活动” => mode=recent，semantic_query="GPT应用场景"。
            - “最近的私域获客活动” => mode=recent，semantic_query="私域获客"。
            - “最近北京的线上沙龙” => mode=recent，city="北京"，delivery_mode="online"，event_type="沙龙"，semantic_query=""。
            - “所有/全部活动” => mode=all；它表示当前时间前后30天，状态不限。
            - “所有GPT活动” => mode=all，semantic_query="GPT"，name=""。
            - 明确“正常/取消/延期/已完成”活动分别使用 normal/cancelled/postponed/completed。
            - 指定具体活动详情或报名链接使用 detail，并填写可验证的 name；只有“这个活动/第二个活动”而历史无法唯一还原名称时使用 clarify，不能按新召回排序猜测。
            - semantic_query 保留完整主题语义，不机械拆词，不包含“最近、活动、有哪些、正常”等路由或筛选词。
            - “GPT应用场景”保留为 semantic_query，不要擅自强制映射为 topic=AI应用；只有用户明确说出受控主题名称时才填写 topic。
            - name 只填写用户明确指定的具体活动名称；“GPT应用场景”“私域获客”等主题不是活动名称，必须放入 semantic_query。
            - city、delivery_mode、event_type、topic、industry、business_stage 只填写用户明确提出的限制，不从画像或常识补充。
            - need_links 只有在用户明确索要报名链接、报名入口或报名方式时为 true，否则为 false。
            - primary_intent=activity 时，activity 必须包含协议中的全部字段；非活动问题的 activity 必须为 null。primary_intent=solution_optimization 或 faq 时，faq_mode 必须分别为空字符串或 general/case/clarify。
        - id: unified-intent-user
          role: user
          text: |-
            最新用户问题：
            {{#sys.query#}}

            会话摘要：
            {{#start.conversation_summary#}}

            最近对话：
            {{#start.recent_history_text#}}

