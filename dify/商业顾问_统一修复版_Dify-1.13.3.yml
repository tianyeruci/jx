        y: 360
      selected: false
      type: custom
      width: 242
    - data:
        code: |-
          import re

          def main(query: str) -> dict:
              raw = str(query or "").strip()
              normalized = re.sub(r"[^0-9a-zA-Z\u4e00-\u9fff]", "", raw.lower())
              if not raw:
                  return {
                      "should_direct": "true",
                      "direct_response": "请告诉我你想分析的经营、营销、产品或管理问题。",
                  }
              human_terms = (
                  "转人工", "找人工", "人工客服", "人工咨询", "联系顾问", "找顾问",
                  "联系老师", "老师微信", "顾问微信", "客服微信",
              )
              decline_terms = ("不用人工", "不找人工", "不需要人工", "无需人工", "不要转人工")
              if not any(item in raw for item in decline_terms) and (
                  normalized in {"人工", "老师", "顾问", "客服", "微信"}
                  or any(item in raw for item in human_terms)
              ):
                  return {
                      "should_direct": "true",
                      "direct_response": "这个问题需要人工顾问进一步确认，请通过页面中的人工咨询入口联系我们。",
                  }
              greetings = {
                  "你好", "您好", "hi", "hello", "嗨", "哈喽", "早上好", "下午好",
                  "晚上好", "你是谁", "你能做什么", "你会什么", "在吗",
              }
              thanks = {"谢谢", "感谢", "多谢", "thankyou", "thanks", "thx", "谢谢你", "非常感谢"}
              goodbyes = {"再见", "拜拜", "bye", "goodbye", "下次见", "回头见", "先这样"}
              if normalized in greetings:
                  return {
                      "should_direct": "true",
                      "direct_response": "你好，我可以协助分析经营、营销、产品和管理等商业问题。",
                  }
              if normalized in thanks:
                  return {
                      "should_direct": "true",
                      "direct_response": "不客气。你可以继续告诉我想解决的商业问题。",
                  }
              if normalized in goodbyes:
                  return {
                      "should_direct": "true",
                      "direct_response": "好的，随时欢迎你再来咨询商业问题。",
                  }
              return {"should_direct": "false", "direct_response": ""}
        code_language: python3
        desc: 仅处理固定问候、礼貌用语和明确人工请求；不承担活动、方案、案例或常见问题的业务意图识别。
        outputs:
          direct_response:
            children: null
            type: string
          should_direct:
            children: null
            type: string
        selected: false
        title: 固定直答识别
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
