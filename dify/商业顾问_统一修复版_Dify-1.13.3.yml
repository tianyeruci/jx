    - data:
        code: |-
          import json
          import re

          VALID_PRIMARY_INTENTS = {"activity", "solution_optimization", "faq"}
          VALID_FAQ_MODES = {"general", "case", "clarify"}
          VALID_MODES = {
              "recent", "all", "normal", "cancelled",
              "postponed", "completed", "detail",
          }
          VALID_DELIVERY_MODES = {"online", "offline", "hybrid"}
          VALID_EVENT_TYPES = {
              "课程", "训练营", "沙龙", "圆桌会", "私董会", "直播", "公开课",
              "工作坊", "峰会", "论坛", "分享会", "交流会", "会议",
          }
          VALID_TOPICS = {
              "AI应用", "获客增长", "私域运营", "个人IP", "内容营销", "销售转化",
              "组织管理", "人才管理", "战略经营", "商业模式", "品牌营销",
              "财务经营", "领导力", "创业",
          }
          VALID_INDUSTRIES = {
              "互联网", "电商", "教育培训", "知识付费", "制造业", "零售", "餐饮",
              "专业服务", "医疗健康", "金融", "房地产", "文旅", "农业",
          }
          VALID_BUSINESS_STAGES = {"初创期", "成长期", "成熟期", "转型期"}

          def clean_string(value, limit):
              return str(value).strip()[:limit] if isinstance(value, str) else ""

          def extract_json(text):
              value = str(text or "").strip()
              if value.startswith("```"):
                  value = re.sub(r"^```(?:json)?\s*", "", value, flags=re.I)
                  value = re.sub(r"\s*```$", "", value)
              try:
                  parsed = json.loads(value)
              except Exception:
                  start = value.find("{")
                  end = value.rfind("}")
                  if start < 0 or end <= start:
                      return {}
                  try:
                      parsed = json.loads(value[start:end + 1])
                  except Exception:
                      return {}
              return parsed if isinstance(parsed, dict) else {}

          def normalized_activity(value):
              if not isinstance(value, dict):
                  return None
              mode = clean_string(value.get("mode"), 20)
              if mode not in VALID_MODES:
                  return None
              name = clean_string(value.get("name"), 300)
              if mode == "detail" and not name:
                  return None

              delivery_mode = clean_string(value.get("delivery_mode"), 20)
              event_type = clean_string(value.get("event_type"), 30)
              topic = clean_string(value.get("topic"), 30)
              industry = clean_string(value.get("industry"), 30)
              business_stage = clean_string(value.get("business_stage"), 20)
              return {
                  "mode": mode,
                  "semantic_query": clean_string(value.get("semantic_query"), 200),
                  "name": name,
                  "city": clean_string(value.get("city"), 50),
                  "delivery_mode": (
                      delivery_mode if delivery_mode in VALID_DELIVERY_MODES else ""
                  ),
                  "event_type": event_type if event_type in VALID_EVENT_TYPES else "",
                  "topic": topic if topic in VALID_TOPICS else "",
                  "industry": industry if industry in VALID_INDUSTRIES else "",
                  "business_stage": (
                      business_stage if business_stage in VALID_BUSINESS_STAGES else ""
                  ),
                  "need_links": value.get("need_links") is True,
              }

          def main(intent_text: str) -> dict:
              data = extract_json(intent_text)
              primary = clean_string(data.get("primary_intent"), 30)
              faq_mode = clean_string(data.get("faq_mode"), 20)
              retrieval_query = clean_string(data.get("retrieval_query"), 400)
              if primary not in VALID_PRIMARY_INTENTS:
                  primary = "faq"
                  faq_mode = "clarify"

              activity = data.get("activity")
              if primary == "activity":
                  activity = normalized_activity(activity)
                  if activity is None:
                      primary = "faq"
                      faq_mode = "clarify"
              else:
                  activity = None
                  if primary == "solution_optimization":
                      faq_mode = ""
                      if not retrieval_query:
                          primary = "faq"
                          faq_mode = "clarify"
                  elif primary == "faq":
                      if faq_mode not in VALID_FAQ_MODES or not retrieval_query and faq_mode != "clarify":
                          faq_mode = "clarify"

              if primary == "faq" and faq_mode == "clarify":
                  activity = None
                  retrieval_query = "需要澄清的商业问题"

              if primary == "activity":
                  route_intent = "activity"
              elif primary == "solution_optimization":
                  route_intent = "offer"
              elif faq_mode == "case":
                  route_intent = "case"
              elif faq_mode == "general":
                  route_intent = "general"
              else:
                  route_intent = "clarify"
              is_case = route_intent == "case"
              return {
                  "primary_intent": primary,
                  "route_intent": route_intent,
                  "is_activity_request": "true" if route_intent == "activity" else "false",
                  "is_case_request": "true" if is_case else "false",
                  "retrieval_query": retrieval_query,
                  "activity_json": json.dumps(activity or {}, ensure_ascii=False),
              }
