app:
  description: 以当前使用版 DSL 为唯一行为基线，合入课程合集候选校验、下一步建议内部依据字段、OCR/咨询案例联调所需的稳定输出契约；不改变 HTTP/SSE 外部接口。
  icon: 🧭
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: 商业顾问-统一修复候选
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.4@72bdf0d70a10b1b9f64746ccd1bd792397598f4536872b310e77532af02ad6a6
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 人工顾问微信号；可留空。
    id: 1062f4ac-f357-485c-bfdf-e24b57dd01c2
    name: WECHAT_ID
    selector:
    - env
    - WECHAT_ID
    value: ''
    value_type: string
  - description: 人工顾问展示名称；可留空。
    id: 571e92ad-d0f6-4448-b96c-9fdba47ee4a2
    name: WECHAT_DISPLAY_NAME
    selector:
    - env
    - WECHAT_DISPLAY_NAME
    value: ''
    value_type: string
  - description: 人工服务时间；可留空。
    id: f47ce00b-df66-4a00-8c3e-1724bfa18dbd
    name: WECHAT_WORK_HOURS
    selector:
    - env
    - WECHAT_WORK_HOURS
    value: ''
    value_type: string
  - description: 二维码图片地址或人工联系入口；可留空。
    id: 08683203-8d5f-436a-a822-7b21f9fc5fc6
    name: WECHAT_QR_URL
    selector:
    - env
    - WECHAT_QR_URL
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 2
        file_size_limit: 128
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，我可以回答商业问题，也可以根据你的明确需求推荐已审核课程或学习路线。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我想系统学习AI工具，应该从哪里开始？
    - 有没有适合公众号运营入门的课程？
    - 我已经有一些基础，如何选择AI写作进阶课程？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
