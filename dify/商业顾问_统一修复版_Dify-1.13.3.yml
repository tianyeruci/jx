    - data:
        code: "import json\n\ndef main(split_json: str, original_query: str) -> dict:\n    original = str(original_query or '').strip()\n    try:\n        raw = str(split_json or '').strip()\n        if raw.startswith(chr(96) * 3):\n            raw = raw.strip(chr(96)).strip()\n            if raw.lower().startswith('json'):\n                raw = raw[4:].strip()\n        value = json.loads(raw)\n        kind = str(value.get('question_type') or '').strip().lower()\n        if kind not in {'general', 'course', 'case', 'mixed'}:\n            raise ValueError('invalid question_type')\n        general = str(value.get('general_query') or '').strip()\n        course = str(value.get('course_query') or '').strip()\n        case = str(value.get('case_query') or '').strip()\n        if kind == 'general':\n            general, course, case = general or original, '', ''\n        elif kind == 'course':\n            general, course, case = '', course or original, ''\n        elif kind == 'case':\n            general, course, case = '', '', case or original\n        else:\n            general, course, case = general or original, course or original, ''\n        return {'general_query': general, 'course_query': course, 'case_query': case, 'question_type': kind, 'fallback_used': 'false', 'parse_error': ''}\n    except Exception as exc:\n        return {'general_query': original, 'course_query': original, 'case_query': original, 'question_type': 'mixed', 'fallback_used': 'true', 'parse_error': str(exc)[:300]}"
