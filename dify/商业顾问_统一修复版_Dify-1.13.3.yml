        type: variable-aggregator
        variables:
        - - general_knowledge
          - result
        - - case_knowledge
          - result
      height: 131
      id: advisor_retrieval_aggregate
      position:
        x: 2000
        y: 500
      positionAbsolute:
        x: 2000
        y: 500
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\n\ndef main(results) -> dict:\n    output = []\n    used = 0\n    for index, item in enumerate(results if isinstance(results, list) else [], 1):\n        if index > 8:\n            break\n        if isinstance(item, dict):\n            selected = {}\n            for key in (\"title\", \"content\", \"document_name\", \"score\"):\n                value = item.get(key)\n                if value in (None, \"\", [], {}):\n                    continue\n                selected[key] = str(value)[:8000] if key == \"content\" else value\n        else:\n            selected = {\"content\": str(item)}\n        line = f\"[{index}] \" + json.dumps(selected, ensure_ascii=False, default=str)\n        if used + len(line) > 12000:\n            break\n        output.append(line)\n        used += len(line)\n    return {\"evidence_text\": \"\\n\".join(output), \"has_evidence\": \"true\" if output else \"false\"}\n"
        code_language: python3
        desc: 仅保留回答需要的公开证据字段并限制长度，避免把内部标识传入主模型。
        outputs:
          evidence_text:
            children: null
            type: string
          has_evidence:
            children: null
            type: string
        selected: false
        title: 通用证据压缩
        type: code
        variables:
        - value_selector:
          - advisor_retrieval_aggregate
          - output
          variable: results
      height: 95
