    - data:
        code: "import json\nimport re\n\ndef extract_object(text: str) -> str:\n    value = str(text or \"\").strip()\n    value = re.sub(r\"^```(?:json)?\\s*\", \"\", value, flags=re.I)\n    value = re.sub(r\"\\s*```$\", \"\", value)\n    start = value.find(\"{\")\n    if start < 0:\n        raise ValueError(\"json object not found\")\n    depth = 0\n    in_string = False\n    escaped = False\n    for index in range(start, len(value)):\n        ch = value[index]\n        if in_string:\n            if escaped:\n                escaped = False\n            elif ch == \"\\\\\":\n                escaped = True\n            elif ch == '\"':\n                in_string = False\n        else:\n            if ch == '\"':\n                in_string = True\n            elif ch == \"{\":\n                depth += 1\n            elif ch == \"}\":\n                depth -= 1\n                if depth == 0:\n                    return value[start:index + 1]\n    raise ValueError(\"incomplete json object\")\n\ndef explicit_case_request(text: str, recent_history: str = \"\", conversation_summary: str = \"\") -> bool:\n    value = str(text or \"\").strip()\n    if not value:\n        return False\n\n    # 明确否定“给案例/查案例”的诉求时，绝不进入咨询会议案例检索。\n    negative_patterns = (\n        \"不要案例\", \"不需要案例\", \"不用案例\", \"无需案例\", \"不看案例\", \"不想看案例\",\n        \"别给案例\", \"不要给案例\", \"不用给案例\", \"不查案例\", \"不要查案例\",\n        \"不要类似案例\", \"不需要类似案例\", \"不用类似案例\", \"不要相关案例\",\n    )\n    if any(p in value for p in negative_patterns):\n        return False\n\n    # “课程里有没有案例/这门课讲不讲案例”属于课程内容查询，不是咨询会议案例检索。\n    course_case_patterns = (\n        r\"(?:这门课|这个课程|该课程|课程|课里|课中|教程).{0,8}(?:有|有没有|包含|包括|讲|讲不讲|介绍|提供).{0,6}(?:案例|实例)\",\n        r\"(?:案例|实例).{0,8}(?:是不是|是否|属于).{0,6}(?:课程内容|教学内容)\",\n        r\"(?:课程案例|教学案例|课堂案例).{0,6}(?:有哪些|是什么|讲什么|内容)\",\n    )\n    if any(re.search(p, value) for p in course_case_patterns):\n        return False\n\n    # 只识别“寻找相关/类似/真实案例或类似经验”的明确诉求。\n    # 单纯出现“案例”二字（如“这个案例为什么失败”“案例怎么写”）不会命中。\n    positive_patterns = (\n        r\"(?:相关|类似|相似|同类|同类型|可参考|可借鉴|参考|借鉴|真实|实际)\\s*的?\\s*(?:商业|咨询|企业|公司|项目)?\\s*(?:案例|咨询案例)\",\n        r\"(?:有没有|有无|能否|能不能|帮我|给我|想看|找|查|搜|看看|提供|推荐).{0,8}(?:相关|类似|相似|同类|同类型|真实|实际|可参考|可借鉴)?\\s*的?\\s*(?:案例|咨询案例)\",\n        r\"(?:案例|咨询案例).{0,6}(?:参考|借鉴|类似|相似|相关|同类)\",\n        r\"(?:相关|类似|相似|同类|同类型)\\s*的?\\s*(?:经验|经历|做法)\",\n        r\"有没有\\s*(?:类似|相似|相关|同类|同类型)\\s*的?\\s*(?:经验|经历|做法)\",\n    )\n    if any(re.search(p, value) for p in positive_patterns):\n        return True\n\n    # 上一轮已经在讨论案例时，允许“还有类似的吗/还有相似的吗”这种明确追问继续查案例。\n    followup = re.fullmatch(r\"\\s*(?:还有|再找|再看|再给我|有没有)(?:没有)?\\s*(?:类似|相似|同类|差不多)\\s*的?(?:吗|呢|么)?[？?！!。.]?\\s*\", value)\n    if followup:\n        context = (str(recent_history or \"\") + \"\\n\" + str(conversation_summary or \"\"))[-12000:]\n        if any(k in context for k in (\"案例\", \"咨询案例\", \"类似经验\", \"相似案例\")):\n            return True\n\n    return False\n\ndef has_explicit_course_intent(text: str) -> bool:\n    value = str(text or \"\")\n    course_patterns = (\n        \"课程\", \"学习路线\", \"学习路径\", \"选课\", \"学什么\", \"怎么学\", \"学习顺序\",\n        \"推荐课\", \"推荐课程\", \"课程推荐\", \"路线推荐\", \"下一门课\", \"下一阶段学\",\n    )\n    return any(p in value for p in course_patterns)\n\ndef main(split_json: str, original_query: str, recent_history: str = \"\", conversation_summary: str = \"\") -> dict:\n    original = str(original_query or \"\").strip()\n    force_case = explicit_case_request(original, recent_history, conversation_summary)\n\n    try:\n        raw = extract_object(split_json)\n        raw = re.sub(r\",\\s*([}\\]])\", r\"\\1\", raw)\n        value = json.loads(raw)\n\n        kind = str(value.get(\"question_type\") or \"\").strip().lower()\n        if kind not in {\"general\", \"course\", \"mixed\"}:\n            raise ValueError(\"invalid question_type\")\n\n        general = str(value.get(\"general_query\") or \"\").strip()\n        course = str(value.get(\"course_query\") or \"\").strip()\n\n        if kind == \"general\":\n            general, course = general or original, \"\"\n        elif kind == \"course\":\n            general, course = \"\", course or original\n        else:\n            general, course = general or original, course or original\n\n        if force_case:\n            # 案例检索查询优先采用规划器已经结合上下文生成的 general_query；没有则回退原问题。\n            case_query = general or original\n            if kind in {\"course\", \"mixed\"}:\n                # 同一轮既明确要案例又明确要课程时，案例库与课程库并行检索；仍不增加模型调用。\n                return {\n                    \"general_query\": \"\",\n                    \"course_query\": course or original,\n                    \"case_query\": case_query,\n                    \"question_type\": \"case_mixed\",\n                    \"case_requested\": \"true\",\n                    \"fallback_used\": \"false\",\n                    \"parse_error\": \"\",\n                }\n            return {\n                \"general_query\": \"\",\n                \"course_query\": \"\",\n                \"case_query\": case_query,\n                \"question_type\": \"case\",\n                \"case_requested\": \"true\",\n                \"fallback_used\": \"false\",\n                \"parse_error\": \"\",\n            }\n\n        return {\n            \"general_query\": general,\n            \"course_query\": course,\n            \"case_query\": \"\",\n            \"question_type\": kind,\n            \"case_requested\": \"false\",\n            \"fallback_used\": \"false\",\n            \"parse_error\": \"\",\n        }\n    except Exception as exc:\n        if force_case:\n            route_kind = \"case_mixed\" if has_explicit_course_intent(original) else \"case\"\n            return {\n                \"general_query\": \"\",\n                \"course_query\": original if route_kind == \"case_mixed\" else \"\",\n                \"case_query\": original,\n                \"question_type\": route_kind,\n                \"case_requested\": \"true\",\n                \"fallback_used\": \"true\",\n                \"parse_error\": str(exc)[:300],\n            }\n\n        # 非案例请求保持原 DSL 的解析失败兜底：双路 mixed 检索，避免空回答。\n        return {\n            \"general_query\": original,\n            \"course_query\": original,\n            \"case_query\": \"\",\n            \"question_type\": \"mixed\",\n            \"case_requested\": \"false\",\n            \"fallback_used\": \"true\",\n            \"parse_error\": str(exc)[:300],\n        }\n"
        code_language: python3
