    - data:
        code: "import json\nimport re\n\ndef extract_object(text: str) -> str:\n    value = str(text or \"\").strip()\n    value = re.sub(r\"^```(?:json)?\\s*\", \"\", value, flags=re.I)\n    value = re.sub(r\"\\s*```$\", \"\", value)\n    start = value.find(\"{\")\n    if start < 0:\n        raise ValueError(\"json object not found\")\n    depth = 0\n    in_string = False\n    escaped = False\n    for index in range(start, len(value)):\n        ch = value[index]\n        if in_string:\n            if escaped:\n                escaped = False\n            elif ch == \"\\\\\":\n                escaped = True\n            elif ch == '\"':\n                in_string = False\n        else:\n            if ch == '\"':\n                in_string = True\n            elif ch == \"{\":\n                depth += 1\n            elif ch == \"}\":\n                depth -= 1\n                if depth == 0:\n                    return value[start:index + 1]\n    raise ValueError(\"incomplete json object\")\n\ndef to_string_list(value):\n    if not isinstance(value, list):\n        return []\n    result = []\n    for item in value:\n        text = str(item or \"\").strip()\n        if text and text not in result:\n            result.append(text)\n    return result\n\ndef main(raw_text: str, human_response: str) -> dict:\n    try:\n        raw = extract_object(raw_text)\n        raw = re.sub(r\",\\s*([}\\]])\", r\"\\1\", raw)\n        value = json.loads(raw)\n\n        intent = str(value.get(\"intent\") or \"clarification\").strip()\n        if intent not in {\"general_qa\", \"direct_course\", \"route_recommendation\", \"clarification\"}:\n            intent = \"clarification\"\n\n        progress = value.get(\"progress_action\")\n        if not isinstance(progress, dict):\n            progress = {}\n        progress_type = str(progress.get(\"type\") or \"none\").strip()\n        if progress_type not in {\"none\", \"confirm_route\", \"confirm_current_stage\", \"confirm_stage_completed\"}:\n            progress_type = \"none\"\n        progress_action = {\n            \"type\": progress_type,\n            \"route_id\": str(progress.get(\"route_id\") or \"\").strip(),\n            \"stage_id\": str(progress.get(\"stage_id\") or \"\").strip(),\n            \"evidence_quote\": str(progress.get(\"evidence_quote\") or \"\").strip(),\n        }\n\n        decision = {\n            \"intent\": intent,\n            \"candidate_course_ids\": to_string_list(value.get(\"candidate_course_ids\")),\n            \"expert_course_ids\": to_string_list(value.get(\"expert_course_ids\")),\n            \"candidate_route_id\": str(value.get(\"candidate_route_id\") or \"\").strip(),\n            \"missing_information\": to_string_list(value.get(\"missing_information\")),\n            \"clarification_question\": str(value.get(\"clarification_question\") or \"\").strip(),\n            \"expert_insight\": str(value.get(\"expert_insight\") or \"\").strip(),\n            \"progress_action\": progress_action,\n        }\n\n        handoff_raw = value.get(\"handoff_required\", False)\n        handoff = handoff_raw is True or str(handoff_raw).strip().lower() in {\"true\", \"1\", \"yes\"}\n        answer = str(value.get(\"final_answer\") or \"\").strip()\n        if handoff:\n            contact = str(human_response or \"\").strip()\n            if answer and contact and contact not in answer:\n                answer = answer + \"\\n\\n\" + contact\n            elif not answer:\n                answer = contact\n        if not answer and decision[\"clarification_question\"]:\n            answer = decision[\"clarification_question\"]\n        if not answer:\n            raise ValueError(\"final_answer is empty\")\n\n        decision_json = json.dumps(decision, ensure_ascii=False)\n        return {\n            \"text\": decision_json,\n            \"final_text\": answer,\n            \"decision_json\": decision_json,\n            \"valid\": \"true\",\n            \"candidate_course_ids_json\": json.dumps(decision[\"candidate_course_ids\"], ensure_ascii=False),\n            \"expert_course_ids_json\": json.dumps(decision[\"expert_course_ids\"], ensure_ascii=False),\n            \"candidate_route_id\": decision[\"candidate_route_id\"],\n            \"progress_action_json\": json.dumps(progress_action, ensure_ascii=False),\n            \"handoff_required\": \"true\" if handoff else \"false\",\n            \"parse_error\": \"\",\n        }\n    except Exception as exc:\n        return {\n            \"text\": \"\",\n            \"final_text\": \"\",\n            \"decision_json\": \"\",\n            \"valid\": \"false\",\n            \"candidate_course_ids_json\": \"[]\",\n            \"expert_course_ids_json\": \"[]\",\n            \"candidate_route_id\": \"\",\n            \"progress_action_json\": '{\"type\":\"none\",\"route_id\":\"\",\"stage_id\":\"\",\"evidence_quote\":\"\"}',\n            \"handoff_required\": \"false\",\n            \"parse_error\": str(exc)[:500],\n        }"
