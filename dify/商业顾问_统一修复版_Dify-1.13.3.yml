    - data:
        code_language: python3
        desc: 从 doc_metadata 读取动态筛选后的活动，按状态阶段和时间排序、去重并受 activity_max_results 限制；列表仅显示名称、时间、状态，明确活动详情请求才显示详情字段。
        code: |-
          import json
          from datetime import datetime, timezone, timedelta

          DISPLAY_STATUS = {
              "normal": "正常",
              "cancelled": "取消",
              "postponed": "延期",
              "completed": "已完成",
          }
          DISPLAY_MODE = {"online": "线上", "offline": "线下", "hybrid": "混合"}
          def number(value):
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  return float(value)
              try:
                  return float(str(value).strip())
              except Exception:
                  return None

          def normalized(value):
              return "".join(
                  char for char in str(value or "").casefold()
                  if char.isalnum() or "\u4e00" <= char <= "\u9fff"
              )

          def metadata_dict(item):
              metadata = item.get("metadata", {}) if isinstance(item, dict) else {}
              raw = metadata.get("doc_metadata", metadata)
              if isinstance(raw, str):
                  try:
                      raw = json.loads(raw)
                  except Exception:
                      return {}
              if isinstance(raw, list):
                  raw = {
                      entry.get("name"): entry.get("value")
                      for entry in raw
                      if isinstance(entry, dict) and entry.get("name")
                  }
              return raw if isinstance(raw, dict) else {}

          def main(
              results,
              start_ts,
              end_ts,
              now_ts,
              activity_filters_json: str,
              requested_status: str,
              activity_max_results=10,
          ) -> dict:
              start = number(start_ts) or 0
              end = number(end_ts) or 0
              now = number(now_ts) or start
              status = str(requested_status or "recent")
              all_mode = status == "all"
              try:
                  filters = json.loads(activity_filters_json or "{}")
              except Exception:
                  filters = {}
              if not isinstance(filters, dict):
                  filters = {}

              candidates = []
              if isinstance(results, list):
                  for entry in results:
                      if isinstance(entry, list):
                          candidates.extend(entry)
                      else:
                          candidates.append(entry)

              selected = {}
              exact_fields = (
                  "city", "delivery_mode", "event_type", "topic", "industry", "business_stage",
              )
              for item in candidates:
                  raw = metadata_dict(item)
                  if raw.get("record_type") != "event":
                      continue
                  event_status = str(raw.get("event_status") or "")
                  required_event_status = str(filters.get("event_status") or "")
                  if required_event_status and event_status != required_event_status:
                      continue
                  if status in {"normal", "cancelled", "postponed", "completed"} and event_status != status:
                      continue
                  if status == "recent" and event_status not in {"normal", "postponed"}:
                      continue
                  if any(
                      str(filters.get(field) or "")
                      and str(raw.get(field) or "") != str(filters[field])
                      for field in exact_fields
                  ):
                      continue

                  title = str(
                      raw.get("source_title")
                      or (item.get("title") if isinstance(item, dict) else "")
                      or (item.get("document_name") if isinstance(item, dict) else "")
                      or ""
                  )
                  name_contains = normalized(filters.get("name_contains"))
                  if name_contains and name_contains not in normalized(title):
                      continue

                  event_start = number(raw.get("event_start_ts"))
                  event_end = number(raw.get("event_end_ts"))
                  if status == "detail":
                      pass
                  elif event_end is None or event_end < start or event_end > end:
                      continue

                  event_id = str(
                      raw.get("event_id")
                      or (item.get("document_name") if isinstance(item, dict) else "")
                      or title
                  )
                  selected[event_id] = (event_start, event_end, raw, item, title)

              def order(row):
                  event_start, event_end, raw, _, _ = row
                  stable_id = str(raw.get("event_id") or "")
                  if event_start is None or event_end is None:
                      return (1, float("inf"), stable_id)
                  if event_start <= now < event_end:
                      return (0, event_start, stable_id)
                  if event_start > now:
                      return (1, event_start, stable_id)
                  return (2, -event_end, stable_id)

              ordered = sorted(selected.values(), key=order)
              detail_mode = status == "detail"
              if detail_mode and not normalized(filters.get("name_contains")):
                  return {
                      "activity_text": "请提供具体活动名称后查询详情。"
                  }
              if detail_mode:
                  ordered = ordered[:1]
              else:
                  try:
                      limit = int(number(activity_max_results) or 10)
                  except Exception:
                      limit = 10
                  ordered = ordered[:max(1, min(10, limit))]

              def display_time(event_start, event_status):
                  if event_status == "postponed" and event_start is None:
                      return "延期未定"
                  if event_start is None:
                      return "时间未定"
                  value = datetime.fromtimestamp(
                      event_start, timezone(timedelta(hours=8))
                  )
                  date_text = f"{value.year}年{value.month}月{value.day}日"
                  return f"{date_text} {value:%H:%M}" if value.hour or value.minute else date_text

              lines = []
              for event_start, _, raw, item, title in ordered:
                  event_status = str(raw.get("event_status") or "")
                  status_text = DISPLAY_STATUS.get(
                      event_status,
                      str(raw.get("source_status") or event_status),
                  )
                  time_text = display_time(event_start, event_status)
                  if not detail_mode:
                      lines.append(f"{title}｜{time_text}｜{status_text}")
                      continue

                  mode = DISPLAY_MODE.get(
                      str(raw.get("delivery_mode") or ""),
                      str(raw.get("delivery_mode") or ""),
                  )
                  city = str(raw.get("city") or "")
                  details = [status_text, time_text]
                  if mode:
                      details.append(mode)
                  if city and city != "线上":
                      details.append(city)
                  line = f"{title}（{'，'.join(details)}）"
                  summary = str(raw.get("activity_summary") or "").strip()
                  if summary:
                      line += f"\n简介：{summary}"
                  link = raw.get("registration_url")
                  deadline = number(raw.get("registration_deadline_ts"))
                  if (
                      filters.get("need_links") is True
                      and
                      event_status in {"normal", "postponed"}
                      and isinstance(link, str)
                      and link.startswith(("http://", "https://"))
                      and (deadline is None or deadline >= now)
                  ):
                      line += f"\n报名链接：{link}"
                  lines.append(line)

              status_label = {
                  "recent": "最近",
                  "normal": "正常",
                  "cancelled": "取消",
                  "postponed": "延期",
                  "completed": "已完成",
                  "all": "所有",
                  "detail": "指定",
              }.get(status, "")
              text = "\n".join(lines) or f"当前没有符合条件的{status_label}活动。"
              if all_mode:
                  text = "查询范围仅限当前时间前后30天内的活动。\n" + text
              return {"activity_text": text}
        outputs:
          activity_text:
            children: null
            type: string
