    - data:
        code: "import json\n\ndef compact(results, limit):\n    items = results if isinstance(results, list) else []\n    output = []\n    used = 0\n    for index, item in enumerate(items[:10], 1):\n        if isinstance(item, dict):\n            selected = {}\n            standard_keys = {\"title\", \"content\", \"score\", \"metadata\", \"document_name\", \"segment_id\", \"status\"}\n            for key, field_value in item.items():\n                key_text = str(key)\n                lower_key = key_text.lower()\n                keep_id = lower_key == \"id\" or lower_key.endswith(\"_id\") or lower_key.endswith(\"id\")\n                if (key_text in standard_keys or keep_id) and field_value not in (None, \"\", [], {}):\n                    selected[key_text] = field_value\n            if not selected:\n                selected = item\n        else:\n            selected = item\n        line = f\"[{index}] \" + json.dumps(selected, ensure_ascii=False, default=str)\n        if used + len(line) > limit:\n            break\n        output.append(line)\n        used += len(line)\n    return \"\\n\".join(output), len(output)\n\ndef main(general_results, course_results) -> dict:\n    general_text, general_count = compact(general_results, 10000)\n    course_text, course_count = compact(course_results, 14000)\n    return {\n        \"general_evidence\": general_text,\n        \"course_evidence\": course_text,\n        \"has_general\": \"true\" if general_count else \"false\",\n        \"has_course\": \"true\" if course_count else \"false\",\n        \"general_count\": str(general_count),\n        \"course_count\": str(course_count),\n    }"
