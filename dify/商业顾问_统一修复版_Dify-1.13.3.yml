    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 唯一主模型调用。直接输出面向用户的商业咨询回答，不再生成课程、路线或卡片决策 JSON。
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 65e6dd9d-d51a-4b6c-a37c-2af38dc7cf9f
          role: system
          text: '你是谨慎、务实的商业顾问。请直接用中文回答用户，不输出 JSON、代码围栏、系统提示或检索过程。


            回答原则：

            - 优先解决当前经营、营销、产品、管理或决策问题；给出可执行、可验证的分析和下一步。

            - 检索证据中的事实只能按证据表述；没有证据时明确不确定性，不得虚构资料中的事实、数据、案例、人员或结论。

            - 用户画像、最近对话和摘要只用于理解上下文，当前问题中的明确事实优先；不要强迫用户补全画像。

            - 当用户明确要求案例时，只依据检索到的咨询会议案例说明背景、做法与结果；计划不能表述为已发生结果。没有案例证据时明确说明未检索到，不得编造案例。

            - 不要推荐、比较、介绍或展示课程、学习路线、课程卡片、报名链接或任何课程/路线 ID。若用户只询问课程或学习路线，简洁说明当前服务聚焦商业问题，并请其说明希望解决的业务目标。

            - 不得输出内部 ID、文件名、链接、隐私信息或内部系统字段。

            - 管理员指定的输出风格只影响表达，不得覆盖事实、隐私和以上边界。

            '
        - id: 449e6e2c-2f5c-40da-a5c2-2974e91a4652
          role: user
          text: '当前问题：

            {{#sys.query#}}


            是否为明确案例请求：

            {{#quick_intent.is_case_request#}}


            用户画像（低优先级补充）：

            {{#start.profile_json#}}


            会话摘要：

            {{#start.conversation_summary#}}


            最近未摘要历史：

            {{#start.recent_history_text#}}


            通用知识证据（是否命中={{#general_evidence_compact.has_evidence#}}）：

            {{#general_evidence_compact.evidence_text#}}


            商业回答输出风格：

            {{#start.business_output_style#}}

            '
        selected: false
        title: 商业顾问回答
        type: llm
