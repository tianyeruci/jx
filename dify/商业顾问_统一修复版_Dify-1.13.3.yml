    - data:
        code: "import json\n\ndef main(results, case_results=None) -> dict:\n    items = []\n    for source in (results, case_results):\n        if isinstance(source, list):\n            items.extend(source)\n    output = []\n    used = 0\n    limit = 14000\n    for index, item in enumerate(items[:10], 1):\n        if isinstance(item, dict):\n            selected = {}\n            standard_keys = {'title', 'content', 'score', 'metadata', 'document_name', 'segment_id', 'status'}\n            for key, field_value in item.items():\n                key_text = str(key)\n                lower_key = key_text.lower()\n                keep_id = lower_key == 'id' or lower_key.endswith('_id') or lower_key.endswith('id')\n                if (key_text in standard_keys or keep_id) and field_value not in (None, '', [], {}):\n                    selected[key_text] = field_value\n            if not selected:\n                selected = item\n        else:\n            selected = item\n        line = f'[{index}] ' + json.dumps(selected, ensure_ascii=False, default=str)\n        if used + len(line) > limit:\n            break\n        output.append(line)\n        used += len(line)\n    return {'evidence_text': '\\n'.join(output), 'has_evidence': 'true' if output else 'false', 'evidence_count': str(len(output))}"
