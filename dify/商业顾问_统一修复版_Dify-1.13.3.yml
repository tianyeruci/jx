    nodes:
    - data:
        desc: AI管理服务每轮注入本地摘要、最近历史、画像和路线进度。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 本地会话ID
          max_length: 100
          required: true
          type: text-input
          variable: local_conversation_id
        - label: 历史摘要
          max_length: 12000
          required: false
          type: paragraph
          variable: conversation_summary
        - label: 最近对话
          max_length: 24000
          required: false
          type: paragraph
          variable: recent_history_text
        - label: 用户画像JSON
          max_length: 12000
          required: false
          type: paragraph
          variable: profile_json
        - label: 路线进度JSON
          max_length: 12000
          required: false
          type: paragraph
          variable: route_progress_json
        - label: 商业回答输出风格
          max_length: 4000
          required: false
          type: paragraph
          variable: business_output_style
        - label: 专家见解输出风格
          max_length: 4000
          required: false
          type: paragraph
          variable: expert_insight_style
      height: 309
      id: start
      position:
        x: 0
        y: 376
      positionAbsolute:
        x: 0
        y: 376
      selected: false
      type: custom
      width: 242
    - data:
        code: "import re\n\ndef main(query: str, wechat_id: str = \"\", wechat_display_name: str = \"\", wechat_work_hours: str = \"\", wechat_qr_url: str = \"\") -> dict:\n    raw = str(query or \"\").strip()\n\n    def normalize(text: str) -> str:\n        return re.sub(r\"[^0-9a-zA-Z\\u4e00-\\u9fff]\", \"\", str(text or \"\").lower())\n\n    def contact_message() -> str:\n        lines = [\"这个问题需要人工顾问进一步确认。\"]\n        if str(wechat_display_name or \"\").strip():\n            lines.append(\"联系人：\" + str(wechat_display_name).strip())\n        if str(wechat_id or \"\").strip():\n            lines.append(\"微信号：\" + str(wechat_id).strip())\n        if str(wechat_work_hours or \"\").strip():\n            lines.append(\"服务时间：\" + str(wechat_work_hours).strip())\n        if str(wechat_qr_url or \"\").strip():\n            lines.append(\"联系入口：\" + str(wechat_qr_url).strip())\n        if len(lines) == 1:\n            lines.append(\"请通过页面中的人工咨询入口联系我们。\")\n        return \"\\n\".join(lines)\n\n    human_response = contact_message()\n    normalized = normalize(raw)\n\n    if not raw:\n        return {\n            \"should_direct\": \"true\",\n            \"direct_type\": \"empty\",\n            \"direct_response\": \"请告诉我你想了解的商业问题、课程或学习路线。\",\n            \"human_response\": human_response,\n            \"normalized_query\": normalized,\n        }\n\n    negative_human = (\n        \"不用人工\", \"不找人工\", \"不需要人工\", \"无需人工\", \"先别转人工\",\n        \"不要转人工\", \"不用老师\", \"不找老师\", \"不用顾问\", \"不加微信\"\n    )\n    explicit_human = (\n        \"转人工\", \"找人工\", \"要人工\", \"需要人工\", \"人工客服\", \"人工服务\", \"人工咨询\", \"联系人工\",\n        \"真人客服\", \"联系老师\", \"找老师\", \"咨询老师\", \"老师微信\",\n        \"联系顾问\", \"找顾问\", \"顾问微信\", \"微信联系\", \"客服微信\", \"联系微信\",\n        \"加你的微信\", \"加老师微信\", \"加顾问微信\", \"加客服微信\"\n    )\n    has_negative = any(p in raw for p in negative_human)\n    exact_short_human = normalized in {normalize(x) for x in (\"人工\", \"老师\", \"顾问\", \"顾问咨询\", \"微信\", \"客服\", \"真人\")}\n    strong_human = any(p in raw for p in explicit_human)\n    wechat_topic_words = (\"加微信率\", \"微信营销\", \"企业微信\", \"微信运营\", \"微信生态\", \"微信广告\", \"微信支付\", \"转化率\", \"运营\", \"营销\", \"策略\", \"话术\")\n    explicit_add_wechat = \"加微信\" in raw and not any(p in raw for p in wechat_topic_words) and (\n        len(normalized) <= 12 or any(p in raw for p in (\"你的微信\", \"老师微信\", \"顾问微信\", \"客服微信\", \"联系\", \"咨询\"))\n    )\n    if not has_negative and (exact_short_human or strong_human or explicit_add_wechat):\n        return {\n            \"should_direct\": \"true\",\n            \"direct_type\": \"human\",\n            \"direct_response\": human_response,\n            \"human_response\": human_response,\n            \"normalized_query\": normalized,\n        }\n\n    greetings = {\n        \"你好\", \"您好\", \"hi\", \"hello\", \"嗨\", \"哈喽\", \"早上好\", \"下午好\", \"晚上好\",\n        \"你是谁\", \"你能做什么\", \"你会什么\", \"功能介绍\", \"在吗\", \"开始\", \"开始咨询\"\n    }\n    thanks = {\"谢谢\", \"感谢\", \"多谢\", \"thankyou\", \"thanks\", \"thx\", \"谢谢你\", \"非常感谢\"}\n    goodbyes = {\"再见\", \"拜拜\", \"bye\", \"goodbye\", \"下次见\", \"回头见\", \"先这样\"}\n\n    if normalized in {normalize(x) for x in greetings}:\n        response = \"你好，我可以回答商业问题，也可以根据你的明确需求推荐已审核课程或学习路线。\"\n        kind = \"greeting\"\n    elif normalized in {normalize(x) for x in thanks}:\n        response = \"不客气。你可以继续告诉我想解决的商业问题，或希望学习的方向。\"\n        kind = \"thanks\"\n    elif normalized in {normalize(x) for x in goodbyes}:\n        response = \"好的，随时欢迎你再来咨询商业问题、课程或学习路线。\"\n        kind = \"goodbye\"\n    else:\n        response = \"\"\n        kind = \"business\"\n\n    return {\n        \"should_direct\": \"true\" if response else \"false\",\n        \"direct_type\": kind,\n        \"direct_response\": response,\n        \"human_response\": human_response,\n        \"normalized_query\": normalized,\n    }"
