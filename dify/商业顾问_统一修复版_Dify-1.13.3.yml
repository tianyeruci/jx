    - data:
        code_language: python3
        desc: 生成中国时区的动态活动状态和三十天时间窗口；活动列表默认最多 10 条，供 Knowledge Retrieval 先过滤。
        code: |-
          import json
          from datetime import datetime, timedelta, timezone

          DELIVERY_LABELS = {"online": "线上", "offline": "线下", "hybrid": "混合"}
          ENUMS = {
              "event_type": (
                  "课程", "训练营", "沙龙", "圆桌会", "私董会", "直播", "公开课",
                  "工作坊", "峰会", "论坛", "分享会", "交流会", "会议",
              ),
              "topic": (
                  "AI应用", "获客增长", "私域运营", "个人IP", "内容营销", "销售转化",
                  "组织管理", "人才管理", "战略经营", "商业模式", "品牌营销",
                  "财务经营", "领导力", "创业",
              ),
              "industry": (
                  "互联网", "电商", "教育培训", "知识付费", "制造业", "零售", "餐饮",
                  "专业服务", "医疗健康", "金融", "房地产", "文旅", "农业",
              ),
              "business_stage": ("初创期", "成长期", "成熟期", "转型期"),
          }

          def main(activity_json: str, configured_activity_max_results="10") -> dict:
              now = datetime.now(timezone(timedelta(hours=8)))
              try:
                  plan = json.loads(activity_json or "{}")
              except Exception:
                  plan = {}
              if isinstance(plan, dict) and plan.get("mode") in {
                  "recent", "all", "normal", "cancelled",
                  "postponed", "completed", "detail",
              }:
                  mode = plan["mode"]
                  filters = {}
                  retrieval_terms = []
                  semantic_query = str(plan.get("semantic_query") or "").strip()[:200]
                  name = str(plan.get("name") or "").strip()[:300]

                  city = str(plan.get("city") or "").strip()
                  if city:
                      filters["city"] = city
                      retrieval_terms.append(city)
                  delivery_mode = str(plan.get("delivery_mode") or "").strip()
                  if delivery_mode in DELIVERY_LABELS:
                      filters["delivery_mode"] = delivery_mode
                      retrieval_terms.append(DELIVERY_LABELS[delivery_mode])
                  for field, values in ENUMS.items():
                      value = str(plan.get(field) or "").strip()
                      if value in values:
                          filters[field] = value
                          retrieval_terms.append(value)

                  explicit_status = mode if mode in {
                      "normal", "cancelled", "postponed", "completed",
                  } else ""
                  if explicit_status:
                      filters["event_status"] = explicit_status
                  if mode == "detail" and name:
                      filters["name_contains"] = name
                  filters["need_links"] = plan.get("need_links") is True

                  window_start = (
                      now - timedelta(days=30)
                      if mode in {"all", "completed"}
                      else now
                  )
                  window_end = now if mode == "completed" else now + timedelta(days=30)
                  try:
                      configured_limit = int(float(str(configured_activity_max_results or "10").strip()))
                  except (TypeError, ValueError):
                      configured_limit = 10

                  if mode == "detail":
                      retrieval_query = name
                  elif semantic_query:
                      retrieval_query = semantic_query
                  elif retrieval_terms:
                      retrieval_query = " ".join(retrieval_terms)
                  else:
                      retrieval_query = "活动 时间 状态"
                  return {
                      "now_ts": int(now.timestamp()),
                      "start_ts": int(window_start.timestamp()),
                      "end_ts": int(window_end.timestamp()),
                      "requested_status": mode,
                      "retrieval_path": (
                          "detail" if mode == "detail"
                          else "status" if explicit_status
                          else mode
                      ),
                      "activity_max_results": max(1, min(10, configured_limit)),
                      "activity_retrieval_query": retrieval_query,
                      "activity_filters_json": json.dumps(filters, ensure_ascii=False),
                  }

              # 理论上无法到达：统一意图结果校验节点已会拦截非法活动 JSON。
              # 仍返回安全、稳定的近期窗口，保证 Code 节点契约完整，不再从原话做删词或关键词意图猜测。
              try:
                  configured_limit = int(float(str(configured_activity_max_results or "10").strip()))
              except (TypeError, ValueError):
                  configured_limit = 10
              return {
                  "now_ts": int(now.timestamp()),
                  "start_ts": int(now.timestamp()),
                  "end_ts": int((now + timedelta(days=30)).timestamp()),
                  "requested_status": "recent",
                  "retrieval_path": "recent",
                  "activity_max_results": max(1, min(10, configured_limit)),
                  "activity_retrieval_query": "活动 时间 状态",
                  "activity_filters_json": '{"need_links": false}',
              }
        outputs:
          end_ts:
            children: null
            type: number
          requested_status:
            children: null
            type: string
          retrieval_path:
            children: null
            type: string
          activity_max_results:
            children: null
            type: number
          start_ts:
            children: null
            type: number
          now_ts:
            children: null
            type: number
          activity_retrieval_query:
            children: null
            type: string
          activity_filters_json:
            children: null
            type: string
        selected: false
        title: 活动动态筛选条件
        type: code
        variables:
        - value_selector:
          - activity_intent
          - activity_json
          variable: activity_json
        - value_selector:
          - env
          - ACTIVITY_MAX_RESULTS
          variable: configured_activity_max_results
