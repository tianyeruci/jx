    - data:
        code: "import re\n\ndef main(query: str) -> dict:\n    raw = str(query or \"\").strip()\n    normalized = re.sub(r\"[^0-9a-zA-Z\\u4e00-\\u9fff]\", \"\", raw.lower())\n    if not raw:\n        return {\"should_direct\": \"true\", \"direct_response\": \"请告诉我你想分析的经营、营销、产品或管理问题。\"}\n    human_terms = (\"转人工\", \"找人工\", \"人工客服\", \"人工咨询\", \"联系顾问\", \"找顾问\", \"联系老师\", \"老师微信\", \"顾问微信\", \"客服微信\")\n    decline_terms = (\"不用人工\", \"不找人工\", \"不需要人工\", \"无需人工\", \"不要转人工\")\n    if not any(item in raw for item in decline_terms) and (normalized in {\"人工\", \"老师\", \"顾问\", \"客服\", \"微信\"} or any(item in raw for item in human_terms)):\n        return {\"should_direct\": \"true\", \"direct_response\": \"这个问题需要人工顾问进一步确认，请通过页面中的人工咨询入口联系我们。\"}\n    greetings = {\"你好\", \"您好\", \"hi\", \"hello\", \"嗨\", \"哈喽\", \"早上好\", \"下午好\", \"晚上好\", \"你是谁\", \"你能做什么\", \"你会什么\", \"在吗\"}\n    thanks = {\"谢谢\", \"感谢\", \"多谢\", \"thankyou\", \"thanks\", \"thx\", \"谢谢你\", \"非常感谢\"}\n    goodbyes = {\"再见\", \"拜拜\", \"bye\", \"goodbye\", \"下次见\", \"回头见\", \"先这样\"}\n    if normalized in greetings:\n        return {\"should_direct\": \"true\", \"direct_response\": \"你好，我可以协助分析经营、营销、产品和管理等商业问题。\"}\n    if normalized in thanks:\n        return {\"should_direct\": \"true\", \"direct_response\": \"不客气。你可以继续告诉我想解决的商业问题。\"}\n    if normalized in goodbyes:\n        return {\"should_direct\": \"true\", \"direct_response\": \"好的，随时欢迎你再来咨询商业问题。\"}\n    case_terms = (\"相关案例\", \"类似案例\", \"相似案例\", \"同类案例\", \"真实案例\", \"案例参考\", \"案例经验\", \"类似经验\", \"同类经验\")\n    return {\n        \"should_direct\": \"false\",\n        \"direct_response\": \"\",\n        \"is_case_request\": \"true\" if any(item in raw for item in case_terms) else \"false\",\n    }\n"
        code_language: python3
        desc: 固定问候、礼貌用语和明确人工请求不调用模型；其余问题进入一次检索和一次主回答，只有明确案例请求才检索咨询会议案例。
        outputs:
          direct_response:
            children: null
            type: string
          should_direct:
            children: null
            type: string
          is_case_request:
            children: null
            type: string
        selected: false
        title: 固定意图与人工请求识别
