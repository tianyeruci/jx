            通用查询={{#query_split_normalize.general_query#}}

            课程查询={{#query_split_normalize.course_query#}}


            案例查询={{#query_split_normalize.case_query#}}


            通用知识证据（是否命中={{#general_evidence_compact.has_evidence#}}）：

            {{#general_evidence_compact.evidence_text#}}


            商业回答输出风格：

            {{#start.business_output_style#}}


            专家见解输出风格：

            {{#start.expert_insight_style#}}'
        selected: false
        title: 通用问题合并决策与回答模型
        type: llm
      height: 131
      id: combined_response_general
      position:
        x: 3118
