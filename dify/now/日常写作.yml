    - data:
        code: "\"\"\"Dify code node. Pure per-request logic; no shared mutable state\
          \ or network.\"\"\"\nimport json\nimport re\nimport unicodedata\n\n\ndef\
          \ load(value):\n    try:\n        value = json.loads(value or '{}') if isinstance(value,\
          \ str) else value\n    except (ValueError, TypeError):\n        return {}\n\
          \    return value if isinstance(value, dict) else {}\n\n\ndef main(query:\
          \ str, writing_type: str, task_state: str) -> dict:\n    raw = str(query\
          \ or '').strip()\n    text = unicodedata.normalize('NFKC', raw)\n    norm\
          \ = re.sub(r'[^0-9a-zA-Z\\u4e00-\\u9fff]', '', text.lower())\n    state\
          \ = load(task_state)\n    active = state.get('status') in ('awaiting', 'writing',\
          \ 'completed') and bool(state.get('brief'))\n    pending = active and state.get('status')\
          \ == 'awaiting'\n    hint = str(writing_type or '').strip().lower()\n  \
          \  seed = {'active': bool(active), 'pending': bool(pending), 'type_hint':\
          \ hint if hint in ('polish', 'expand') else '',\n            'force_generate':\
          \ False, 'explicit_new': False, 'selections': {}, 'control_only': False,\
          \ 'selection_like': False}\n\n    def finish(route='plan', message='', plan=None):\n\
          \        return {'route': route, 'direct_response': message,\n         \
          \       'fast_plan': json.dumps(plan, ensure_ascii=False) if isinstance(plan,\
          \ dict) else '',\n                'seed': json.dumps(seed, ensure_ascii=False)}\n\
          \n    if not raw or not norm:\n        return finish('direct', '把想写的主题、想法或原文发给我即可。')\n\
          \    # Exact full-message matches, not substring tests. Context-dependent\
          \ phrases are excluded.\n    fixed = [\n        ({'你好', '您好', 'hi', 'hello',\
          \ '嗨', '哈喽', '在吗', '早', '早安', '午安', '早上好', '下午好', '晚上好', '你好在吗', '您好在吗'},\n\
          \         '你好，把想表达的内容、想法或原文发给我，我会帮你润色或扩充成稿。'),\n        ({'谢谢', '谢谢你', '感谢',\
          \ '感谢你', '多谢', '谢了', '非常感谢', 'thanks', 'thankyou', 'thx'},\n         '不客气，后续调整直接接着说即可。'),\n\
          \        ({'再见', '拜拜', 'bye', 'goodbye', '下次见', '回头见', '晚安', '先这样', '先这样吧'},\n\
          \         '好的，下次需要写作或修改时再聊。'),\n        ({'你是谁', '你是什么', '你能做什么', '你会什么',\
          \ '能做什么', '会做什么', '可以做什么', 'help', 'whatareyou', 'whatcanyoudo'},\n    \
          \     '我可以润色原文、扩充内容，也可以根据主题写参考稿，并结合当前对话继续修改。')]\n    for words, message\
          \ in fixed:\n        if norm in words:\n            return finish('direct',\
          \ message)\n    if not active and norm in {'怎么用', '如何使用', '这是干嘛的', '这是做什么的',\
          \ 'howtouse'}:\n        return finish('direct', '把想写的主题或原文发给我，再说要润色还是扩充即可。')\n\
          \    if not active and norm in {'1', '2', '立即生成', '直接生成', '按默认来', '好的',\
          \ '可以', '行', 'ok', '收到', '嗯'}:\n        return finish('direct', '把要写的主题、想法或原文发给我，我就能开始处理。')\n\
          \n    seed['explicit_new'] = bool(re.match(r'^(?:另外[，,:：\\s]*)?(?:换个话题|换个主题|新任务|开始新任务|另一个任务|重新开始)(?:[，,:：。\\\
          s]|$)', text))\n    if seed['explicit_new']:\n        seed['active'] = False\n\
          \        seed['pending'] = False\n        return finish()\n    execute =\
          \ {'1', '立即生成', '直接生成', '直接写', '现在生成', '马上生成', '按默认来', '全部按默认',\n      \
          \         '用默认选项', '全部按建议', '全部按建议执行', '默认即可', '生成吧', '不用问了直接写', '不补充了直接生成'}\n\
          \    confirm = {'好的', '可以', '行', 'ok', '嗯', '收到', '没问题', '就这样', '开始吧'}\n\
          \    if pending and norm == '2':\n        return finish('direct', '直接回复题号和选项即可，例如“1、A”；未回答的按默认选择，也可以回复“立即生成”。')\n\
          \    if pending and norm in execute | confirm:\n        seed['force_generate']\
          \ = True\n        seed['control_only'] = True\n        return finish('fast',\
          \ plan={'_fast': True, 'action': 'generate', 'task_relation': 'same'})\n\
          \    # On a full first-turn instruction, a prefix command is a safe no-question\
          \ hint;\n    # semantic handling of quotations/negations remains with the\
          \ planner.\n    if re.match(r'^(?:请)?(?:立即生成|直接生成|直接写|不要提问|不用问了|别问了)[，,:：。\\\
          s]', text):\n        seed['force_generate'] = True\n\n    pattern = r'(?<![\\\
          w])(?:问题\\s*)?(\\d{1,2})\\s*[、.．:：)）\\-]?\\s*([A-Fa-f])(?![A-Za-z0-9])'\n\
          \    matches = list(re.finditer(pattern, text)) if pending else []\n   \
          \ if matches:\n        questions = {str(q.get('id')): q for q in state.get('questions',\
          \ []) if isinstance(q, dict)}\n        pure = not text[:matches[0].start()].strip('\
          \ \\n\\t。.;；,，')\n        for index, match in enumerate(matches):\n    \
          \        qid, label = match.group(1), match.group(2).upper()\n         \
          \   end = matches[index + 1].start() if index + 1 < len(matches) else len(text)\n\
          \            detail = text[match.end():end].strip(' \\n\\t。.;；,，:：')\n \
          \           question = questions.get(qid, {})\n            options = question.get('options',\
          \ [])\n            custom = options[-1].get('label') if options else None\n\
          \            if detail:\n                pure = False\n            if qid\
          \ in questions:\n                seed['selections'][qid] = {'label': label,\
          \ 'detail': detail}\n        seed['selection_like'] = True\n        seed['force_generate']\
          \ = True\n        if re.search(r'(?:另外|换个主题|新任务|重新写一篇|改成扩充|改为扩充|改成润色)',\
          \ text):\n            pure = False\n        if pure:\n            return\
          \ finish('fast', plan={'_fast': True, 'action': 'generate', 'task_relation':\
          \ 'same'})\n    return finish()\n"
        code_language: python3
