          \ '正式简洁', '像平时交流一样，但不要太随意。'),\n    'length': ('你希望写多长？', '按内容完整表达，不额外拉长',\
          \ '适当展开解释', '大约八百字，把步骤说明白就行。'),\n    'platform': ('这篇内容准备发布在哪里？', '按通用阅读格式整理',\
