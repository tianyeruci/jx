            id\":\"n1\",\"question\":\"对象＋需要查明的信息＋条件\",\"depends_on\":[]}],\n \"queries\"\
            :[{\"id\":\"q1\",\"query\":\"完整信息需求的检索表达\",\"fallback_query\":\"\",\"\
