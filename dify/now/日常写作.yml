    - data:
        code: "import json\n\nSTAGE = 'primary'  # The builder changes this to 'fallback'\
          \ for the fallback inspector.\n\n\ndef main(result: list, item_json: str)\
          \ -> dict:\n    try:\n        item = json.loads(item_json or '{}')\n   \
          \ except (ValueError, TypeError):\n        item = {}\n    item = item if\
          \ isinstance(item, dict) else {}\n    documents, failed, rejected = [],\
          \ False, 0\n    if not isinstance(result, list):\n        failed = True\n\
          \    for doc in result if isinstance(result, list) else []:\n        if\
          \ not isinstance(doc, dict):\n            continue\n        if doc.get('_retrieval_error')\
          \ is True:\n            failed = True\n            continue\n        metadata\
          \ = doc.get('metadata') if isinstance(doc.get('metadata'), dict) else {}\n\
          \        record_type = metadata.get('record_type')\n        for key in ('doc_metadata',\
          \ 'document_metadata'):\n            nested = metadata.get(key)\n      \
          \      if record_type is None and isinstance(nested, dict):\n          \
          \      record_type = nested.get('record_type')\n        # Both retrieval\
          \ nodes enforce metadata=article server-side. Check again only\n       \
          \ # when this custom metadata is actually present in the response.\n   \
          \     if record_type is not None and record_type != 'article':\n       \
          \     rejected += 1\n            continue\n        content = doc.get('content')\n\
          \        if isinstance(content, str) and content.strip():\n            documents.append(doc)\n\
          \    status = 'error' if failed else ('ok' if documents else 'empty')\n\
          \    alternate = item.get('fallback_query', '')\n    do_fallback = STAGE\
          \ == 'primary' and not failed and not documents and bool(alternate)\n  \
          \  packet = {'query_id': item.get('id', ''), 'query': item.get('query',\
          \ ''),\n              'executed_query': alternate if STAGE == 'fallback'\
          \ else item.get('query', ''),\n              'covers': item.get('covers',\
          \ []), 'stage': STAGE, 'status': status,\n              'rejected_record_types':\
          \ rejected, 'documents': documents}\n    return {'do_fallback': 'true' if\
          \ do_fallback else 'false',\n            'packet': json.dumps(packet, ensure_ascii=False,\
          \ separators=(',', ':'))}\n"
