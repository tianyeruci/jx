    - data:
        code: "import hashlib\nimport json\n\n\ndef main(packets: list) -> dict:\n\
          \    records, groups, runs = {}, [], []\n    failures = 0\n    for packet\
          \ in packets if isinstance(packets, list) else []:\n        try:\n     \
          \       packet = json.loads(packet) if isinstance(packet, str) else packet\n\
          \        except (ValueError, TypeError):\n            packet = None\n  \
          \      if not isinstance(packet, dict):\n            failures += 1\n   \
          \         continue\n        qid = str(packet.get('query_id', ''))\n    \
          \    runs.append({'query_id': qid, 'status': packet.get('status', 'error'),\n\
          \                     'stage': packet.get('stage', 'primary'), 'executed_query':\
          \ packet.get('executed_query', '')})\n        group, local_seen = [], set()\n\
          \        for rank, doc in enumerate(packet.get('documents', []), 1):\n \
          \           if not isinstance(doc, dict) or not isinstance(doc.get('content'),\
          \ str):\n                continue\n            content = doc['content'].strip()\n\
          \            if not content:\n                continue\n            md =\
          \ doc.get('metadata') if isinstance(doc.get('metadata'), dict) else {}\n\
          \            identity = '/'.join(str(md.get(key, '')) for key in ('dataset_id',\
          \ 'document_id', 'segment_id', 'version'))\n            # Content hash also\
          \ protects against stale versions reusing the same IDs.\n            identity\
          \ += '/' + hashlib.sha256(content.encode('utf-8')).hexdigest()\n       \
          \     if identity in local_seen:\n                continue\n           \
          \ local_seen.add(identity)\n            group.append(identity)\n       \
          \     if identity not in records:\n                records[identity] = {'title':\
          \ doc.get('title', '') or md.get('document_name', ''), 'content': content,\n\
          \                                     'metadata': md, 'query_ids': [], 'need_ids':\
          \ [], 'rrf': 0.0}\n            record = records[identity]\n            record['rrf']\
          \ += 1.0 / (60.0 + rank)  # equal channel weights; not confidence\n    \
          \        if qid not in record['query_ids']:\n                record['query_ids'].append(qid)\n\
          \            for nid in packet.get('covers', []):\n                if nid\
          \ not in record['need_ids']:\n                    record['need_ids'].append(nid)\n\
          \        groups.append(group)\n    # Reserve candidates from each information-need\
          \ group before global rank filling.\n    selected_ids = []\n    for _ in\
          \ range(2):\n        for group in groups:\n            remaining = [key\
          \ for key in group if key not in selected_ids]\n            if remaining:\n\
