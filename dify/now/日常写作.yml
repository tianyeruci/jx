        desc: 只输出规划JSON；已提交表单的确定指令绕过此节点。
        error_strategy: default-value
        memory:
          query_prompt_template: '当前用户原始消息（本轮最高任务依据）：

            {{#sys.query#}}


            代码识别的控制信息：

            {{#fixed_message_filter.seed#}}


            同一会话已保存的任务状态（可为空，不能把默认值当用户事实）：

