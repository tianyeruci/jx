    - data:
        code: "import re\nimport calendar\nfrom datetime import datetime, timedelta,\
          \ timezone\n\nTZ = timezone(timedelta(hours=8))\n\n\ndef month_range(now,\
          \ offset):\n    year = now.year + (now.month - 1 + offset) // 12\n    month\
          \ = (now.month - 1 + offset) % 12 + 1\n    first = datetime(year, month,\
          \ 1, tzinfo=TZ)\n    last_day = calendar.monthrange(year, month)[1]\n  \
          \  end = datetime(year, month, last_day, 23, 59, 59, tzinfo=TZ)\n    return\
          \ first, end\n\n\ndef main(query: str, activity_mode: str, configured_activity_max_results=\"\
          10\") -> dict:\n    now = datetime.now(TZ)\n    text = str(query or \"\"\
          )\n    mode = str(activity_mode or \"recent_available\")\n\n    if mode\
          \ == \"recent_available\":\n        start = now\n        end = now + timedelta(days=30)\n\
          \    elif mode == \"detail\":\n        start = now - timedelta(days=3650)\n\
          \        end = now + timedelta(days=3650)\n    else:\n        start = now\
          \ - timedelta(days=30)\n        end = now + timedelta(days=30)\n\n    #\
          \ 用户明确范围优先于默认范围。只处理项目最常见的相对时间表达。\n    m = re.search(r\"(?:未来|接下来|后)(\\d{1,3})天\"\
          , text)\n    if m:\n        days = max(1, min(365, int(m.group(1))))\n \
          \       start, end = now, now + timedelta(days=days)\n    m = re.search(r\"\
          过去(\\d{1,3})天\", text)\n    if m:\n        days = max(1, min(365, int(m.group(1))))\n\
          \        start, end = now - timedelta(days=days), now\n    m = re.search(r\"\
          最近(\\d{1,3})天\", text)\n    if m:\n        days = max(1, min(365, int(m.group(1))))\n\
          \        if mode == \"recent_available\":\n            start, end = now,\
          \ now + timedelta(days=days)\n        else:\n            start, end = now\
          \ - timedelta(days=days), now + timedelta(days=days)\n    m = re.search(r\"\
          (?:未来|接下来)(\\d{1,2})周\", text)\n    if m:\n        days = max(7, min(365,\
          \ int(m.group(1)) * 7))\n        start, end = now, now + timedelta(days=days)\n\
          \    m = re.search(r\"(?:未来|接下来)(\\d{1,2})个月\", text)\n    if m:\n     \
          \   days = max(30, min(730, int(m.group(1)) * 30))\n        start, end =\
          \ now, now + timedelta(days=days)\n\n    if \"今天\" in text:\n        start\
          \ = datetime(now.year, now.month, now.day, tzinfo=TZ)\n        end = start\
          \ + timedelta(days=1) - timedelta(seconds=1)\n    elif \"明天\" in text:\n\
          \        start = datetime(now.year, now.month, now.day, tzinfo=TZ) + timedelta(days=1)\n\
          \        end = start + timedelta(days=1) - timedelta(seconds=1)\n    elif\
          \ \"下周\" in text:\n        this_monday = datetime(now.year, now.month, now.day,\
          \ tzinfo=TZ) - timedelta(days=now.weekday())\n        start = this_monday\
          \ + timedelta(days=7)\n        end = start + timedelta(days=7) - timedelta(seconds=1)\n\
          \    elif \"本周\" in text or \"这周\" in text:\n        this_monday = datetime(now.year,\
          \ now.month, now.day, tzinfo=TZ) - timedelta(days=now.weekday())\n     \
          \   start = max(now, this_monday) if mode == \"recent_available\" else this_monday\n\
          \        end = this_monday + timedelta(days=7) - timedelta(seconds=1)\n\
          \    elif \"下个月\" in text or \"下月\" in text:\n        start, end = month_range(now,\
          \ 1)\n    elif \"本月\" in text or \"这个月\" in text or \"这月\" in text:\n  \
          \      month_start, month_end = month_range(now, 0)\n        start = max(now,\
          \ month_start) if mode == \"recent_available\" else month_start\n      \
          \  end = month_end\n\n    try:\n        configured_limit = int(float(str(configured_activity_max_results\
          \ or \"10\").strip()))\n    except (TypeError, ValueError):\n        configured_limit\
          \ = 10\n    limit = max(1, min(20, configured_limit))\n\n    requested_status\
          \ = mode if mode in {\"recent_available\", \"recent_all\", \"detail\", \"\
          cancelled\", \"postponed\", \"completed\"} else \"recent_available\"\n \
          \   return {\n        \"start_ts\": int(start.timestamp()),\n        \"\
          end_ts\": int(end.timestamp()),\n        \"requested_status\": requested_status,\n\
          \        \"activity_max_results\": limit,\n    }\n"
        code_language: python3
