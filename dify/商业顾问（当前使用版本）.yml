    - data:
        code: |
          import re

          def main(query: str) -> dict:
              raw = str(query or "").strip()
              normalized = re.sub(r"[^0-9a-zA-Z\u4e00-\u9fff]", "", raw.lower())
              if not raw:
                  return {"should_direct": "true", "direct_response": "请告诉我你想分析的经营、营销、产品或管理问题。"}
              human_terms = ("转人工", "找人工", "人工客服", "人工咨询", "联系顾问", "找顾问", "联系老师", "老师微信", "顾问微信", "客服微信")
              decline_terms = ("不用人工", "不找人工", "不需要人工", "无需人工", "不要转人工")
              if not any(item in raw for item in decline_terms) and (normalized in {"人工", "老师", "顾问", "客服", "微信"} or any(item in raw for item in human_terms)):
                  return {"should_direct": "true", "direct_response": "这个问题需要人工顾问进一步确认，请通过页面中的人工咨询入口联系我们。"}
              greetings = {"你好", "您好", "hi", "hello", "嗨", "哈喽", "早上好", "下午好", "晚上好", "你是谁", "你能做什么", "你会什么", "在吗"}
              thanks = {"谢谢", "感谢", "多谢", "thankyou", "thanks", "thx", "谢谢你", "非常感谢"}
              goodbyes = {"再见", "拜拜", "bye", "goodbye", "下次见", "回头见", "先这样"}
              if normalized in greetings:
                  return {"should_direct": "true", "direct_response": "你好，我可以协助分析经营、营销、产品和管理等商业问题。"}
              if normalized in thanks:
                  return {"should_direct": "true", "direct_response": "不客气。你可以继续告诉我想解决的商业问题。"}
              if normalized in goodbyes:
                  return {"should_direct": "true", "direct_response": "好的，随时欢迎你再来咨询商业问题。"}
              case_terms = ("相关案例", "类似案例", "相似案例", "同类案例", "真实案例", "案例参考", "案例经验", "类似经验", "同类经验")
              activity_entity_terms = ("活动", "会议", "沙龙", "工作坊", "训练营", "直播", "峰会", "论坛", "分享会", "交流会", "私董会", "公开课", "实战营", "成长营", "体验营", "训练班", "专场", "圆桌", "大会", "日程", "聚会", "场次", "安排", "排期", "联谊")
              activity_entity = any(item in raw for item in activity_entity_terms)
              reference_terms = ("这个活动", "该活动", "这个会议", "该会议", "第一个", "第1个", "第二个", "第2个", "第三个", "第3个", "第四个", "第4个", "第五个", "第5个", "第一个活动", "第一个会议", "上述活动", "刚才的活动")
              activity_name_marker = any(item in raw for item in ("营", "大会", "专场", "圆桌", "沙龙", "峰会", "工作坊", "训练", "活动", "会议", "直播", "公开课"))
              activity_reference = activity_entity or any(item in raw for item in reference_terms) or activity_name_marker
              listing_terms = ("最近", "近期", "最新", "有哪些", "有什么", "可以参加", "本月", "接下来", "所有", "全部", "历史", "已结束", "安排", "日程", "排期", "聚会", "场次", "联谊")
              detail_terms = ("详情", "详细", "介绍", "地点", "在哪里", "形式", "具体")
              registration_terms = ("报名链接", "报名方式", "报名入口", "报名地址", "怎么报名", "如何报名")
              status_terms = ("延期", "改期", "取消", "完成", "已结束")
              analysis_terms = ("如何", "怎么", "策略", "方法", "影响", "挽回", "复盘", "提升", "提高", "优化", "建议", "分析", "转化")
              normalized_for_registration = normalized.rstrip("?？。！! ")
              registration_request = any(item in raw for item in registration_terms) or normalized_for_registration.endswith("报名")
              is_detail_request = (activity_reference or activity_name_marker) and (any(item in raw for item in detail_terms) or registration_request or any(item in raw for item in reference_terms))
              is_analysis_request = any(item in raw for item in analysis_terms) and not is_detail_request
              is_case_request = any(item in raw for item in case_terms)
              normalized_activity_only = normalized in {"活动", "会议", "最近活动", "近期活动", "最新活动", "所有活动", "全部活动"}
              is_activity_request = activity_reference and not is_analysis_request and not is_case_request and (
                  normalized_activity_only
                  or
                  any(item in raw for item in listing_terms)
                  or any(item in raw for item in status_terms)
                  or is_detail_request
              )
              return {
                  "should_direct": "false",
                  "direct_response": "",
                  "is_case_request": "true" if is_case_request else "false",
                  "is_activity_request": "true" if is_activity_request else "false",
              }
        code_language: python3
        desc: 固定问候、礼貌用语和明确人工请求不调用模型；其余问题进入一次检索和一次主回答，只有明确案例请求才检索咨询会议案例。
        outputs:
          direct_response:
            children:
            type: string
          should_direct:
            children:
            type: string
          is_case_request:
            children:
            type: string
          is_activity_request:
            children:
            type: string
        selected: false
        title: 固定意图与人工请求识别
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
      height: 111
