app:
  description: Dify 1.13.3：一次性可选问卷；查询控制文本分离；有限并发证据检索和逐查询诊断；活动零结果一次补查，原条件复核。
  icon: 🧭
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: 商业顾问｜检索修复版
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.19@cbcbc332b69c40dd6fa69993cfeb5b09c13d22ddc787de96c9bf16e02fa51536
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - description: 同一会话的当前任务、实际问卷、用户答案与默认策略；每轮仅由任务状态保存节点写入。
    id: cbe71eb4-bc9e-4b14-b86e-34df0339296e
    name: task_state
    selector:
    - conversation
    - task_state
    value: '{}'
    value_type: string
  environment_variables:
  - description: 未指定数量时最多展示50场已召回活动；不代表全库枚举，明确数量最高200。
    id: 5d9bb08d-f403-4c94-9f6d-5dc7c64a9cb5
    name: ACTIVITY_MAX_RESULTS
    selector:
    - env
    - ACTIVITY_MAX_RESULTS
    value: '50'
    value_type: string
  - description: 单次计划的总查询上限，包含保真主问题；默认3=主问题+最多2条独立证据需求，允许1—8。
    id: 83b21f66-8cc7-4390-a633-903ef3b9b5cc
    name: RAG_MAX_QUERIES
    selector:
    - env
    - RAG_MAX_QUERIES
    value: '3'
    value_type: string
  - description: 沿用原变量名：true=活动列表并行补充一次候选（不只零结果）；false=仅主查。详情不补查。两路结果合并后仍按原条件复核。
    id: 664814ad-a733-4cce-956c-8e404cbe608a
    name: ACTIVITY_EMPTY_RETRY
    selector:
    - env
    - ACTIVITY_EMPTY_RETRY
    value: 'true'
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 2
        file_size_limit: 128
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，把你的产品方案、定价、权益或产品文案发给我，给你打磨优化。
