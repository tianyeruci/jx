    - data:
        code: |
          import json
          from datetime import datetime, timezone, timedelta

          def number(value):
              if isinstance(value, (int, float)) and not isinstance(value, bool): return float(value)
              try: return float(str(value).strip())
              except Exception: return None

          def main(results, query: str, start_ts, end_ts, requested_status: str, activity_max_results=10) -> dict:
              start = number(start_ts) or 0
              end = number(end_ts) or 0
              query_text = str(query or "")
              requested_status = str(requested_status or "normal")
              all_mode = requested_status == "all" or any(word in query_text for word in ("所有", "全部", "历史"))
              list_terms = ("最近", "近期", "最新", "有哪些", "有什么", "可以参加", "本月", "接下来", "所有", "全部", "历史", "已结束")
              detail_terms = ("详情", "详细", "介绍", "地点", "在哪里", "形式", "怎么报名", "报名链接", "报名方式", "报名入口", "报名地址", "具体")
              reference_terms = ("这个活动", "该活动", "这个会议", "该会议", "第一个", "第1个", "第二个", "第2个", "第三个", "第3个", "第四个", "第4个", "第五个", "第5个", "第一个活动", "第一个会议", "上述活动", "刚才的活动")
              activity_entity_terms = ("活动", "会议", "沙龙", "工作坊", "训练营", "直播", "峰会", "论坛", "分享会", "交流会", "私董会", "公开课", "实战营", "成长营", "体验营", "训练班", "专场", "圆桌", "大会", "日程", "聚会", "场次", "安排", "排期", "联谊")
              normalized_query = "".join(ch for ch in query_text.lower() if ch.isalnum() or "\u4e00" <= ch <= "\u9fff")
              specific_activity_marker = any(term in query_text for term in ("营", "大会", "专场", "圆桌", "沙龙", "峰会", "工作坊", "公开课"))
              ordinal_phrase = "第" in query_text and "个" in query_text
              specific_activity_reference = any(term in query_text for term in reference_terms) or specific_activity_marker or ordinal_phrase
              list_mode = requested_status != "detail" and (any(term in query_text for term in list_terms) or normalized_query in {"活动", "会议", "最近活动", "近期活动", "最新活动", "所有活动", "全部活动"})
              detail_mode = requested_status == "detail" or (not list_mode and specific_activity_reference and (any(term in query_text for term in detail_terms) or any(term in query_text for term in reference_terms)))
              limit = max(1, min(20, int(number(activity_max_results) or 10)))
              selected = {}
              all_results = []
              for batch in (results,):
                  if isinstance(batch, list): all_results.extend(batch)
              for item in all_results:
                  metadata = item.get("metadata", {}) if isinstance(item, dict) else {}
                  raw = metadata.get("doc_metadata", metadata)
                  if isinstance(raw, str):
                      try: raw = json.loads(raw)
                      except Exception: raw = {}
                  if isinstance(raw, list):
                      raw = {entry.get("name"): entry.get("value") for entry in raw if isinstance(entry, dict) and entry.get("name")}
                  if not isinstance(raw, dict) or raw.get("record_type") != "event": continue
                  event_status = raw.get("event_status")
                  detail_request = requested_status == "detail"
                  if not detail_request and requested_status in {"cancelled", "postponed", "completed"} and event_status != requested_status: continue
                  if not detail_request and not all_mode and requested_status in {"recent", "normal"} and event_status not in {"normal", "postponed"}: continue
                  timestamp = number(raw.get("event_start_ts"))
                  event_end = number(raw.get("event_end_ts"))
                  if timestamp is None or event_end is None:
                      if not (detail_request or (all_mode and event_status == "postponed")):
                          continue
                  if detail_request:
                      pass
                  elif all_mode:
                      if event_end is not None and timestamp is not None and (event_end < start or timestamp > end): continue
                  elif event_end <= start or timestamp > end: continue
                  event_id = str(raw.get("event_id") or item.get("document_name") or "")
                  selected[event_id] = (timestamp, raw, item)
              def order(value):
                  timestamp, metadata, _ = value
                  event_end = number(metadata.get("event_end_ts"))
                  if timestamp is None or event_end is None: return (1, float("inf"), str(metadata.get("event_id", "")))
                  if timestamp <= start <= event_end: return (0, timestamp, str(metadata.get("event_id", "")))
                  if timestamp > start: return (1, timestamp, str(metadata.get("event_id", "")))
                  return (2, -event_end, str(metadata.get("event_id", "")))
              ordered_all = sorted(selected.values(), key=order)
              if detail_mode:
                  normalized_query_for_match = "".join(ch for ch in query_text.lower() if ch.isalnum() or "\u4e00" <= ch <= "\u9fff")
                  ordinal_request = any(term in query_text for term in reference_terms) or ordinal_phrase
                  def item_title(value):
                      _, metadata, item = value
                      return str(metadata.get("source_title") or item.get("title") or item.get("document_name") or "")
                  if ordinal_request:
                      ordinal_map = {"第一个": 1, "第1个": 1, "第二个": 2, "第2个": 2, "第三个": 3, "第3个": 3, "第四个": 4, "第4个": 4, "第五个": 5, "第5个": 5}
                      requested_ordinal = next((number for term, number in ordinal_map.items() if term in query_text), None)
                      if requested_ordinal is None:
                          ordinal_start = query_text.find("第") + 1
                          ordinal_end = query_text.find("个", ordinal_start)
                          token = query_text[ordinal_start:ordinal_end] if ordinal_end > ordinal_start else ""
                          chinese_digits = {"零": 0, "一": 1, "二": 2, "两": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9}
                          if token.isdigit():
                              requested_ordinal = int(token)
                          elif "十" in token:
                              tens, _, ones = token.partition("十")
                              requested_ordinal = (chinese_digits.get(tens, 1) if tens else 1) * 10 + (chinese_digits.get(ones, 0) if ones else 0)
                          elif token in chinese_digits:
                              requested_ordinal = chinese_digits[token]
                      ordered = ordered_all[requested_ordinal - 1:requested_ordinal] if requested_ordinal and requested_ordinal > 0 else []
                  else:
                      named = [value for value in ordered_all if "".join(ch for ch in item_title(value).lower() if ch.isalnum() or "\u4e00" <= ch <= "\u9fff") in normalized_query_for_match]
                      ordered = named[:1]
              else:
                  ordered = ordered_all[:limit]
              status_text = "所有" if requested_status == "all" else {"normal": "正常", "recent": "最近", "cancelled": "取消", "postponed": "延期", "completed": "已完成", "detail": "活动"}.get(requested_status, "活动")
              def display_time(timestamp, event_status):
                  if event_status == "postponed" and timestamp is None:
                      return "延期未定"
                  if timestamp is None:
                      return "时间未定"
                  value = datetime.fromtimestamp(timestamp, timezone(timedelta(hours=8)))
                  date_text = f"{value.year}年{value.month}月{value.day}日"
                  return f"{date_text} {value:%H:%M}" if value.hour or value.minute else date_text
              lines = []
              for timestamp, metadata, item in ordered:
                  title = metadata.get("source_title") or item.get("title") or item.get("document_name") or "活动"
                  status = metadata.get("source_status") or metadata.get("event_status") or ""
                  time_text = display_time(timestamp, metadata.get("event_status"))
                  summary = str(metadata.get("activity_summary") or "").strip()
                  status = {"normal": "正常", "cancelled": "取消", "postponed": "延期", "completed": "已完成"}.get(str(metadata.get("event_status") or ""), str(metadata.get("source_status") or metadata.get("event_status") or ""))
                  if metadata.get("event_status") == "postponed" and timestamp is None:
                      time_text = "延期未定"
                  if not detail_mode:
                      line = f"{title}｜{time_text}｜{status}"
                  else:
                      line = f"{title}（{status}，{time_text}，{metadata.get('delivery_mode', '')}，{metadata.get('city', '')}）"
                      if summary: line += f"\n简介：{summary}"
                      link = metadata.get("registration_url")
                      deadline = number(metadata.get("registration_deadline_ts"))
                      if metadata.get("event_status") in {"normal", "postponed"} and isinstance(link, str) and link.startswith(("http://", "https://")) and (deadline is None or deadline >= datetime.now(timezone(timedelta(hours=8))).timestamp()): line += f"\n报名链接：{link}"
                  lines.append(line)
              empty_text = "当前没有符合条件的活动。" if requested_status == "detail" else f"当前没有符合条件的{status_text}活动。"
              return {"activity_text": "\n".join(lines) or empty_text}
        code_language: python3
        desc: 从 doc_metadata 读取动态筛选后的活动，按状态阶段和时间排序、去重并受 activity_max_results 限制；列表仅显示名称、时间、状态，明确活动详情请求才显示详情字段。
        outputs:
          activity_text:
            children:
            type: string
        selected: false
        title: 活动结果排序与去重
        type: code
