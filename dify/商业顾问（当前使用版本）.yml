    - data:
        code: "import json\nimport re\nimport unicodedata\n\n\ndef load_state(value):\n\
          \    if not isinstance(value, str) or len(value) > 48000:\n        return\
          \ {}\n    try:\n        obj = json.loads(value)\n    except (ValueError,\
          \ TypeError):\n        return {}\n    if not isinstance(obj, dict) or obj.get('schema')\
          \ != 1:\n        return {}\n    if not isinstance(obj.get('route'), str)\
          \ or obj.get('route') not in {'offer', 'general', 'activity', 'case'}:\n\
          \        return {}\n    if not isinstance(obj.get('questions', []), list)\
          \ or len(obj.get('questions', [])) > 6:\n        return {}\n    seen = set()\n\
          \    for q in obj.get('questions', []):\n        if not isinstance(q, dict)\
          \ or not isinstance(q.get('no'), int) or isinstance(q.get('no'), bool) or\
          \ q['no'] in seen:\n            return {}\n        seen.add(q['no'])\n \
          \       options = q.get('options')\n        if not isinstance(q.get('question'),\
          \ str) or not isinstance(options, list) or not 1 <= len(options) <= 8:\n\
          \            return {}\n        keys = set()\n        for option in options:\n\
          \            if not isinstance(option, dict) or not isinstance(option.get('key'),\
          \ str) or not re.fullmatch(r'[A-Z]', option['key']) or not isinstance(option.get('label'),\
          \ str):\n                return {}\n            if option['key'] in keys:\n\
          \                return {}\n            keys.add(option['key'])\n      \
          \  if q.get('default_key') not in keys:\n            return {}\n    if not\
          \ isinstance(obj.get('answers', {}), dict) or not isinstance(obj.get('user_inputs',\
          \ []), list):\n        return {}\n    return obj\n\n\ndef main(query: str,\
          \ conversation_state: str = '{}', external_state: str = '') -> dict:\n \
          \   state = load_state(conversation_state) or load_state(external_state)\n\
          \    if state:\n        state = dict(state)\n        for field in ['main_query',\
          \ 'base_query']:\n            if isinstance(state.get(field), str):\n  \
          \              state[field] = re.split(r'[；;]本轮补充[：:]|[；;]有效补充[：:]', state[field],\
          \ maxsplit=1)[0].strip()\n    raw = str(query or '').strip()\n    text =\
          \ unicodedata.normalize('NFKC', raw)\n    pending = bool(state and state.get('phase')\
          \ in {'awaiting', 'holding'})\n    questions = state.get('questions', [])\
          \ if pending else []\n    table = {str(q.get('no')): q for q in questions\
          \ if isinstance(q, dict)}\n    control = {'pending': pending, 'action':\
          \ 'interpret', 'answers': {}, 'invalid_choices': [], 'bind_task': False}\n\
          \    # Only an unambiguous whole-message menu command bypasses semantic\
          \ interpretation.\n    clean = re.sub(r'[\\s。！!]+$', '', text)\n    if pending\
          \ and clean == '1':\n        control.update(action='execute', bind_task=True)\n\
          \    elif pending and clean == '2':\n        control.update(action='hold',\
          \ bind_task=True)\n    elif state and re.fullmatch(r'(?:请|那就|那)?(?:立即生成|直接生成|现在生成|开始生成|全部默认|按默认|按推荐|默认选项|先生成|直接执行|马上执行|按默认生成|直接给结果)',\
          \ clean):\n        control.update(action='execute', bind_task=True)\n  \
          \  elif state and re.fullmatch(r'(?:先|暂时)?(?:别|不要|不)(?:现在|立即|直接)?(?:生成|执行)(?:[，,；;\
          \ ]*(?:我)?(?:还要|想先|要|先)(?:再)?补充(?:信息|内容|资料)?)?', clean):\n        control.update(action='hold',\
          \ bind_task=True)\n    elif pending:\n        matches = list(re.finditer(r'(?<![A-Za-z0-9])(?:第)?(\\\
          d{1,2})(?:题)?[\\s、.．:：)）=\\-]*([A-Za-z])(?![A-Za-z])', text))\n        for\
          \ i, match in enumerate(matches):\n            number, letter = match.group(1),\
          \ match.group(2).upper()\n            question = table.get(number)\n   \
          \         options = question.get('options', []) if question else []\n  \
          \          option = next((o for o in options if isinstance(o, dict) and\
          \ o.get('key') == letter), None)\n            if not option:\n         \
          \       control['invalid_choices'].append(number + letter)\n           \
          \     continue\n            end = matches[i+1].start() if i+1 < len(matches)\
          \ else len(text)\n            detail = text[match.end():end].strip(' \\\
          n\\t，,。.;；:：、')\n            custom = bool(option.get('custom'))\n     \
          \       control['answers'][number] = {\n                'question': question.get('question',\
          \ ''), 'key': letter,\n                'value': detail if custom and detail\
          \ else option.get('label', ''),\n                'kind': question.get('kind',\
          \ 'fact'), 'source': 'user_choice',\n                'custom_pending': custom\
          \ and not bool(detail),\n                'detail': detail if not custom\
          \ else '', '_span_start': match.start()\n            }\n        if matches:\n\
          \            # Mixed prose may switch the task or veto generation; the model\
          \ must decide in that case.\n            residue = re.sub(r'(?<![A-Za-z0-9])(?:第)?\\\
          d{1,2}(?:题)?[\\s、.．:：)）=\\-]*[A-Za-z](?![A-Za-z])', '', text)\n        \
          \    pure = not residue.strip(' \\n\\t，,。.;；:：、')\n            if pure:\n\
          \                control.update(action='execute', bind_task=True)\n    \
          \        else:\n                control['action'] = 'answers_with_text'\n\
          \    planner_query = raw\n    if control['bind_task']:\n        planner_query\
          \ = ('这是当前任务的菜单回复，不是新的业务问题。\\n当前任务：' + str(state.get('task_brief', ''))\
          \ +\n                         '\\n用户本轮原文：' + raw + '\\n已按实际问卷解析：' +\n  \
          \                       json.dumps(control, ensure_ascii=False, separators=(',',\
          \ ':')))\n    planner_state = {k: v for k, v in state.items() if k != 'user_inputs'}\n\
          \    return {'state_json': json.dumps(state, ensure_ascii=False, separators=(',',\
          \ ':')),\n            'planner_state_json': json.dumps(planner_state, ensure_ascii=False,\
          \ separators=(',', ':')),\n            'control_json': json.dumps(control,\
          \ ensure_ascii=False, separators=(',', ':')),\n            'planner_query':\
          \ planner_query}\n"
        code_language: python3
