    - data:
        code: |
          def main(is_activity_request: str, query: str) -> dict:
              return {"is_activity_request": "true" if is_activity_request == "true" else "false"}
        code_language: python3
        desc: 只把明确活动/会议意图送入活动检索，普通商业问题继续原有案例/通用分支。
        outputs:
          is_activity_request:
