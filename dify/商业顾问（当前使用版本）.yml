    - data:
        code: "import json\nimport re\n\n\ndef extract_json(text):\n    text = str(text\
          \ or \"\").strip()\n    if text.startswith(\"```\"):\n        text = re.sub(r\"\
          ^```(?:json)?\\s*\", \"\", text, flags=re.I)\n        text = re.sub(r\"\\\
          s*```$\", \"\", text)\n    try:\n        value = json.loads(text)\n    \
          \    return value if isinstance(value, dict) else {}\n    except Exception:\n\
          \        pass\n    start = text.find(\"{\")\n    end = text.rfind(\"}\"\
          )\n    if start >= 0 and end > start:\n        try:\n            value =\
          \ json.loads(text[start:end + 1])\n            return value if isinstance(value,\
          \ dict) else {}\n        except Exception:\n            return {}\n    return\
          \ {}\n\n\ndef truth(value):\n    return \"true\" if str(value).strip().lower()\
          \ in {\"true\", \"1\", \"yes\", \"y\"} else \"false\"\n\n\ndef main(intent_text:\
          \ str, query: str) -> dict:\n    raw_query = str(query or \"\").strip()\n\
          \    data = extract_json(intent_text)\n    retrieval_query = str(data.get(\"\
          retrieval_query\") or raw_query).strip() or raw_query\n    primary = str(data.get(\"\
          primary_intent\") or \"general\").strip().lower()\n    if primary not in\
          \ {\"offer\", \"activity\", \"case\", \"general\"}:\n        primary = \"\
          general\"\n\n    is_offer = truth(data.get(\"is_offer_optimization_request\"\
          ))\n    is_activity = truth(data.get(\"is_activity_request\"))\n    is_case\
          \ = truth(data.get(\"is_case_request\"))\n\n    # 主意图是确定性兜底，避免模型 JSON 中布尔字段偶发不一致。\n\
          \    if primary == \"offer\":\n        is_offer = \"true\"\n    elif primary\
          \ == \"activity\":\n        is_activity = \"true\"\n    elif primary ==\
          \ \"case\":\n        is_case = \"true\"\n\n    # 现有 DSL 的主链路优先级：offer >\
          \ activity > case > general。\n    if is_offer == \"true\":\n        primary\
          \ = \"offer\"\n    elif is_activity == \"true\":\n        primary = \"activity\"\
          \n    elif is_case == \"true\":\n        primary = \"case\"\n    else:\n\
          \        primary = \"general\"\n\n    activity_mode = str(data.get(\"activity_mode\"\
          ) or \"none\").strip().lower()\n    allowed_modes = {\"recent_available\"\
          , \"recent_all\", \"detail\", \"cancelled\", \"postponed\", \"completed\"\
          , \"none\"}\n    if activity_mode not in allowed_modes:\n        activity_mode\
          \ = \"none\"\n    if primary == \"activity\" and activity_mode == \"none\"\
          :\n        activity_mode = \"recent_available\"\n    if primary != \"activity\"\
          :\n        activity_mode = \"none\"\n\n    return {\n        \"retrieval_query\"\
          : retrieval_query,\n        \"primary_intent\": primary,\n        \"is_offer_optimization_request\"\
          : is_offer,\n        \"is_activity_request\": is_activity,\n        \"is_case_request\"\
          : is_case,\n        \"activity_mode\": activity_mode,\n    }\n"
