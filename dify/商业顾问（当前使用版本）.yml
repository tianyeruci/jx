        answer: 正在结合你的情况进行分析，请稍候……
        desc: 在意图识别、检索和主模型调用前立即输出固定提示，降低感知等待时间。
        selected: false
        title: 首字等待提示
        type: answer
        variables: []
      height: 160
      id: progress_answer
      position:
        x: 1046
