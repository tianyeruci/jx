          registration_deadline_ts\"))\n    if reg_start is None and reg_end is None:\n\
          \        return False\n    if reg_start is not None and reg_end is not None:\n\
          \        return reg_start <= end and reg_end >= start\n    if reg_start\
          \ is not None:\n        return start <= reg_start <= end\n    return start\
          \ <= reg_end <= end\n\n\ndef event_intersects(metadata, start, end):\n \
          \   event_start = number(metadata.get(\"event_start_ts\"))\n    event_end\
          \ = number(metadata.get(\"event_end_ts\"))\n    if event_start is None or\
          \ event_end is None:\n        return False\n    return event_end >= start\
          \ and event_start <= end\n\n\ndef display_time(timestamp, event_status):\n\
          \    if event_status == \"postponed\" and timestamp is None:\n        return\
          \ \"延期未定\"\n    if timestamp is None:\n        return \"时间未定\"\n    value\
          \ = datetime.fromtimestamp(timestamp, TZ)\n    date_text = f\"{value.year}年{value.month}月{value.day}日\"\
          \n    return f\"{date_text} {value:%H:%M}\" if value.hour or value.minute\
