          \    if '<redacted' in value.casefold():\n        return ''\n    return\
          \ value.replace('\\x00', '').strip()[:limit]\n\nimport hashlib\n\nMETHOD_TYPES\
          \ = {'methodology','methodology_candidate','validated_universal_methodology'}\n\
          \n\ndef safe_body(text):\n    if not isinstance(text,str):\n        return\
          \ ''\n    # 仅去掉技术标识和“检索问法”区，不凭规则改写业务事实。\n    text = re.sub(r'\\b(?:case|evt)_[A-Za-z0-9_<>-]+',\
          \ '[内部标识已隐藏]', text)\n    text = re.sub(r'^#\\s*匿名商业案例[^\\n]*', '# 匿名商业案例',\
          \ text, flags=re.M)\n    text = re.split(r'^##\\s*常见相似案例问法\\s*$', text,\
          \ maxsplit=1, flags=re.M)[0]\n    return text.replace('\\x00','').strip()\n\
          \n\ndef unpack_batches(items):\n    if not isinstance(items, list):\n  \
          \      raise ValueError('retrieval result must be an array')\n    docs,\
          \ reports = [], []\n    for item in items:\n        if isinstance(item,\
          \ list):\n            inner_docs, inner_reports = unpack_batches(item)\n\
          \            docs.extend(inner_docs)\n            reports.extend(inner_reports)\n\
          \        elif isinstance(item, dict) and item.get('_batch_version') == 1:\n\
          \            if item.get('status') not in {'ok', 'ok_empty'}:\n        \
          \        raise ValueError('Retrieval query did not complete successfully.')\n\
          \            try:\n                rows = json.loads(item.get('documents_json',\
          \ ''))\n            except (TypeError, ValueError):\n                raise\
          \ ValueError('Invalid serialized retrieval documents.')\n            if\
          \ not isinstance(rows, list) or any(not isinstance(r, dict) for r in rows):\n\
          \                raise ValueError('Invalid retrieval documents contract.')\n\
          \            if item.get('returned_count') != len(rows):\n             \
          \   raise ValueError('Retrieval count does not match documents.')\n    \
          \        if (item['status'] == 'ok_empty') != (len(rows) == 0):\n      \
          \          raise ValueError('Retrieval status does not match document count.')\n\
          \            docs.extend(rows)\n            reports.append({k: item[k] for\
          \ k in ['need_id', 'query', 'status', 'returned_count']})\n        elif\
          \ isinstance(item, dict):\n            # Non-iteration case lane / compatible\
          \ previous records.\n            docs.append(item)\n        else:\n    \
          \        raise ValueError('Missing or invalid retrieval task output; do\
          \ not treat as no evidence.')\n    return docs, reports\n\n\ndef flatten(items):\n\
          \    return unpack_batches(items)[0]\n\n\ndef validate_completed_queries(items,\
          \ expected_tasks):\n    if not expected_tasks:\n        return\n    docs,\
          \ reports = unpack_batches(items)\n    expected = {str(t['id']): str(t['query'])\
          \ for t in expected_tasks}\n    actual = {str(r['need_id']): str(r['query'])\
          \ for r in reports}\n    if len(reports) != len(expected_tasks) or expected\
          \ != actual:\n        raise ValueError('检索子任务输出不完整或查询不一致；请检查迭代内部节点，不能作为零命中继续。')\n\
          \n\ndef prepare_evidence(items, scope):\n    items, query_reports = unpack_batches(items)\n\
          \    output, seen = [], {}\n    counts = {'input': len(items), 'empty_body':\
          \ 0, 'scope_rejected': 0, 'duplicates': 0, 'query_reports': query_reports}\n\
          \    for item in items:\n        md = metadata_of(item)\n        raw_kind\
          \ = md.get('record_type')\n        kind = raw_kind if isinstance(raw_kind,\
          \ str) else None\n        allowed = (kind is None or kind == '' or\n   \
          \                (scope == 'method' and kind in METHOD_TYPES) or\n     \
          \              (scope == 'case' and kind == 'consulting_case') or\n    \
          \               (scope == 'general' and kind not in {'event', 'consulting_case'}))\n\
          \        if not allowed:\n            counts['scope_rejected'] += 1\n  \
          \          continue\n        body = safe_body(item.get('content'))\n   \
          \     if not body:\n            counts['empty_body'] += 1\n            continue\n\
          \        trace = item.get('_retrieval') if isinstance(item.get('_retrieval'),\
          \ dict) else {}\n        need_id = str(trace.get('need_id') or 'main')\n\
          \        key = hashlib.sha256((str(md.get('dataset_id') or '') + '|' +\n\
          \                              str(md.get('document_id') or '') + '|' +\
          \ str(kind) + '|' + body).encode()).hexdigest()\n        if key in seen:\n\
          \            record = seen[key]\n            if need_id not in record['retrieval_need_ids']:\n\
          \                record['retrieval_need_ids'].append(need_id)\n        \
          \    counts['duplicates'] += 1\n            continue\n        grades = {\n\
          \            'methodology_candidate': '候选做法：可参考，不能称为验证后的通用规律',\n       \
          \     'validated_universal_methodology': '库内Registry晋升条目，不等于独立外部验证或必然有效',\n\
          \            'methodology': '方法论资料，验证等级未提供',\n            'consulting_case':\
          \ '咨询记录，不预设建议已执行或取得成效'\n        }\n        record = {'record_type': kind\
          \ or 'unknown', 'retrieval_scope': scope,\n                  'evidence_level':\
          \ grades.get(kind, '参考资料，验证等级未提供'),\n                  'content': body,\
          \ 'source_key': key[:16], 'retrieval_need_ids': [need_id]}\n        score\
          \ = md.get('score')\n        if isinstance(score, (int, float)) and not\
          \ isinstance(score, bool):\n            record['retrieval_score'] = score\n\
          \        record['source_truncated'] = bool(trace.get('content_truncated'))\n\
          \        record['candidate_rule'] = '检索候选，不是事实已核实；只使用与当前对象、条件及问题直接相关的内容。'\n\
          \        topic = public_text(md.get('topic'), 120)\n        if topic:\n\
          \            record['topic'] = topic\n        if kind == 'consulting_case'\
          \ or scope == 'case':\n            record['result_boundary'] = '建议、计划和预计效果不是实际执行结果，不能编造成功数据。'\n\
          \        output.append(record)\n        seen[key] = record\n    # Round-robin\
          \ query groups: keep main first without letting all its near-duplicates\
          \ crowd out other needs.\n    groups = {}\n    for record in output:\n \
          \       ids = record['retrieval_need_ids']\n        group = 'main' if 'main'\
          \ in ids else ids[0]\n        groups.setdefault(group, []).append(record)\n\
          \    names = sorted(groups, key=lambda x: (x != 'main', x))\n    ordered\
          \ = []\n    for i in range(max((len(v) for v in groups.values()), default=0)):\n\
          \        for name in names:\n            if i < len(groups[name]):\n   \
          \             ordered.append(groups[name][i])\n    return ordered, counts\n\
          \n\ndef compact(records, max_chars=12000):\n    records = records[:8]\n\
          \    if not records:\n        return ''\n    # 平均分配容量，避免首条长正文吃满预算导致并行的另一类证据完全消失。\n\
          \    per_record = max_chars // len(records) - 2\n    lines = []\n    for\
          \ index,record in enumerate(records,1):\n        copy = dict(record)\n \
          \       body = copy.pop('content')\n        copy['evidence_no'] = index\n\
          \        copy['truncated'] = False\n        overhead = len(json.dumps({**copy,'content':''},ensure_ascii=False,separators=(',',':')))\n\
          \        budget = max(0,per_record-overhead-30)\n        selected = body[:budget]\n\
          \        copy['truncated'] = bool(copy.get('source_truncated')) or len(selected)\
          \ < len(body)\n        copy['content'] = selected\n        line = json.dumps(copy,ensure_ascii=False,separators=(',',':'))\n\
          \        # 引号和换行会增加JSON长度；按序列化后的长度二次收紧。\n        while len(line) > per_record\
          \ and copy['content']:\n            copy['content'] = copy['content'][:max(0,len(copy['content'])-(len(line)-per_record)-5)]\n\
          \            copy['truncated'] = True\n            line = json.dumps(copy,ensure_ascii=False,separators=(',',':'))\n\
          \        lines.append(line)\n    return '\\n'.join(lines)\n\ndef main(methodology_results,\
          \ case_results, expected_tasks=None):\n    validate_completed_queries(methodology_results,\
          \ expected_tasks)\n    methods, mc = prepare_evidence(methodology_results,\
          \ 'method')\n    cases, cc = prepare_evidence(case_results, 'case')\n  \
          \  mixed = []\n    for i in range(max(len(methods), len(cases))):\n    \
          \    if i < len(methods): mixed.append(methods[i])\n        if i < len(cases):\
          \ mixed.append(cases[i])\n        if len(mixed) >= 8: break\n    evidence\
          \ = compact(mixed)\n    return {'offer_evidence_text': evidence, 'has_evidence':\
          \ 'true' if evidence else 'false',\n            'diagnostics': json.dumps({'methodology':\
          \ mc, 'cases': cc, 'retained': len(mixed[:8])}, ensure_ascii=False)}\n"
