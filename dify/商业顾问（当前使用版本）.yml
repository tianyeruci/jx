          \    for i, item in enumerate(results if isinstance(results, list) else\
          \ [], 1):\n        if i > 8:\n            break\n        if isinstance(item,\
          \ dict):\n            selected = {}\n            for key in (\"title\",\
          \ \"content\", \"score\"):\n                value = item.get(key)\n    \
          \            if value in (None, \"\", [], {}):\n                    continue\n\
          \                selected[key] = str(value)[:8000] if key == \"content\"\
          \ else value\n        else:\n            selected = {\"content\": str(item)[:8000]}\n\
          \        line = f\"[{i}] \" + json.dumps(selected, ensure_ascii=False, default=str)\n\
          \        if used + len(line) > 12000:\n            break\n        output.append(line)\n\
          \        used += len(line)\n    text = \"\\n\".join(output)\n    return\
          \ {\"offer_evidence_text\": text, \"has_evidence\": \"true\" if text else\
          \ \"false\"}\n"
