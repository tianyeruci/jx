    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 一次模型调用同时完成上下文问题改写和现有业务分支分类，避免多个串行分类模型。
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: qwen-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: intent-system
          role: system
          text: "你是商业顾问工作流的“上下文意图改写与路由器”。你的任务不是回答用户，而是把用户最新一句话结合上下文还原成适合知识库检索的独立问题，并选择现有工作流的主分支。\n\
            \n只输出一个 JSON 对象，不要代码围栏，不要解释。字段必须完整：\n{\n  \"retrieval_query\": \"可独立检索的完整中文问题\"\
            ,\n  \"primary_intent\": \"offer|activity|case|general\",\n  \"is_offer_optimization_request\"\
            : \"true|false\",\n  \"is_activity_request\": \"true|false\",\n  \"is_case_request\"\
            : \"true|false\",\n  \"activity_mode\": \"recent_available|recent_all|detail|cancelled|postponed|completed|none\"\
            \n}\n\n规则：\n1. 必须结合“最近对话”和“会话摘要”理解“好的、可以、继续、第一个、这个、那个、按这个来”等承接表达。retrieval_query\
            \ 要补足必要对象、动作和约束，但不得捏造上下文没有的事实。\n2. 产品/服务/方案/套餐/会员/权益/价格/定价/收费/报价等的设计、优化、打磨、调整、重构、包装、规划，主分支为\
            \ offer。若同时要求参考案例，仍以 offer 为主，is_case_request 可为 true。\n3. activity 只表示用户在询问实际活动/会议/沙龙/工作坊/训练营/直播/峰会/论坛/公开课等的可参加场次、时间、状态、详情或报名，不要把“营销活动方案”“活动策划案例”误判成实际活动查询。\n\
            4. 用户表达“最近有哪些活动、现在有活动吗、哪些活动在进行、有什么可以参加、近期活动、接下来有什么活动”等参加意图时，activity_mode=recent_available。其含义是找当前至用户要求时间范围内可报名活动；默认未来30天；可报名状态为\
            \ normal 或 postponed。\n5. 用户表达“最近所有活动、最近全部活动、所有最近活动”等，不关注能否报名时，activity_mode=recent_all；默认活动时间窗口为当前时间前后30天，所有状态都允许。用户明确时间范围时必须在\
            \ retrieval_query 中保留。\n6. 用户询问某个具体活动的详情、地点、形式、报名链接、报名方式，activity_mode=detail。询问取消/延期/已完成活动时分别使用\
            \ cancelled/postponed/completed。\n7. case 表示明确索要商业咨询案例、类似案例、成功案例、之前如何解决等；普通商业知识问题为\
            \ general。\n8. 混合意图只选现有工作流最合适的主链路，优先级：offer > activity > case > general。不要创造新分支。\n\
            9. 三个 is_* 字段要与语义一致。primary_intent=offer 时 is_offer_optimization_request\
            \ 必须为 true；primary_intent=activity 时 is_activity_request 必须为 true；primary_intent=case\
            \ 时 is_case_request 必须为 true。\n"
        - id: intent-user
          role: user
          text: '当前最新问题：

            {{#sys.query#}}


            会话摘要：

            {{#start.conversation_summary#}}


            最近对话：

            {{#start.recent_history_text#}}'
        selected: false
        title: 上下文意图改写与路由
