    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: explicit-activity-request
            value: 'true'
            varType: string
            variable_selector:
            - activity_intent
            - is_activity_request
          id: 'true'
          logical_operator: and
        desc: 明确活动意图才进入活动检索，否则保持普通/案例行为。
        selected: false
        title: 是否检索活动
        type: if-else
      height: 191
      id: activity_route
      position:
        x: 1540
        y: 300
      positionAbsolute:
        x: 1540
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          from datetime import datetime, timedelta, timezone

          def main(query: str, configured_activity_max_results="10") -> dict:
              now = datetime.now(timezone(timedelta(hours=8)))
              query = str(query or "")
              activity_entity_terms = ("活动", "会议", "沙龙", "工作坊", "训练营", "直播", "峰会", "论坛", "分享会", "交流会", "私董会", "公开课", "实战营", "成长营", "体验营", "训练班", "专场", "圆桌", "大会", "日程", "聚会", "场次", "安排", "排期", "联谊")
              detail_terms = ("详情", "详细", "介绍", "地点", "在哪里", "形式", "怎么报名", "如何报名", "报名链接", "报名方式", "报名入口", "报名地址", "具体")
              reference_terms = ("这个活动", "该活动", "这个会议", "该会议", "第一个", "第1个", "第二个", "第2个", "第三个", "第3个", "第四个", "第4个", "第五个", "第5个", "上述活动", "刚才的活动")
              normalized_query = "".join(ch for ch in query.lower() if ch.isalnum() or "\u4e00" <= ch <= "\u9fff")
              registration_request = any(item in query for item in ("报名链接", "报名方式", "报名入口", "报名地址", "怎么报名", "如何报名")) or normalized_query.rstrip("?？。！! ").endswith("报名")
              activity_name_marker = any(item in query for item in ("营", "大会", "专场", "圆桌", "沙龙", "峰会", "工作坊", "训练", "活动", "会议", "直播", "公开课"))
              specific_activity_marker = any(item in query for item in ("营", "大会", "专场", "圆桌", "沙龙", "峰会", "工作坊", "公开课"))
              generic_query_terms = detail_terms + ("最近", "近期", "最新", "所有", "全部", "历史", "活动", "会议", "训练", "直播", "日程", "聚会", "场次", "报名", "延期", "改期", "取消", "完成", "已结束", "正常", "状态", "有哪些", "有什么", "可以参加", "本月", "接下来", "的")
              remaining_name = query
              for term in generic_query_terms:
                  remaining_name = remaining_name.replace(term, "")
              remaining_name = "".join(ch for ch in remaining_name if ch.isalnum() or "\u4e00" <= ch <= "\u9fff")
              specific_activity_reference = any(item in query for item in reference_terms) or specific_activity_marker or bool(remaining_name)
              detail_mode = (any(item in query for item in activity_entity_terms) or any(item in query for item in reference_terms) or activity_name_marker) and (any(item in query for item in detail_terms) or registration_request or any(item in query for item in reference_terms))
              detail_specific = detail_mode and specific_activity_reference
              all_mode = any(word in query for word in ("所有", "全部", "历史"))
              requested_status = "detail" if detail_specific else ("cancelled" if "取消" in query else ("completed" if any(word in query for word in ("完成", "已结束")) else ("postponed" if any(word in query for word in ("延期", "改期")) else ("all" if all_mode else "normal"))))
              window_start = now - timedelta(days=30) if all_mode else now
              try:
                  configured_limit = int(float(str(configured_activity_max_results or "10").strip()))
              except (TypeError, ValueError):
                  configured_limit = 10
              activity_max_results = max(1, min(20, configured_limit))
              return {
                  "start_ts": int(window_start.timestamp()),
                  "end_ts": int((now + timedelta(days=30)).timestamp()),
                  "requested_status": requested_status,
                  "activity_max_results": activity_max_results,
              }
        code_language: python3
        desc: 生成中国时区的动态活动状态和三十天时间窗口；活动列表默认最多 10 条，供 Knowledge Retrieval 先过滤。
        outputs:
          end_ts:
            children:
            type: number
          requested_status:
            children:
            type: string
          activity_max_results:
            children:
            type: number
          start_ts:
            children:
            type: number
        selected: false
        title: 活动动态筛选条件
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
        - value_selector:
          - env
          - ACTIVITY_MAX_RESULTS
          variable: configured_activity_max_results
