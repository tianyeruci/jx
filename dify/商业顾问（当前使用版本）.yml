    - data:
        code: |
          import json

          def main(results) -> dict:
              output = []
              used = 0
              for index, item in enumerate(results if isinstance(results, list) else [], 1):
                  if index > 8:
                      break
                  if isinstance(item, dict):
                      selected = {}
                      for key in ("title", "content", "document_name", "score"):
                          value = item.get(key)
                          if value in (None, "", [], {}):
                              continue
                          selected[key] = str(value)[:8000] if key == "content" else value
                  else:
                      selected = {"content": str(item)}
                  line = f"[{index}] " + json.dumps(selected, ensure_ascii=False, default=str)
                  if used + len(line) > 12000:
                      break
                  output.append(line)
                  used += len(line)
              return {"evidence_text": "\n".join(output), "has_evidence": "true" if output else "false"}
        code_language: python3
        desc: 仅保留回答需要的公开证据字段并限制长度，避免把内部标识传入主模型。
        outputs:
          evidence_text:
            children:
            type: string
          has_evidence:
            children:
            type: string
        selected: false
        title: 通用证据压缩
        type: code
        variables:
        - value_selector:
          - advisor_retrieval_aggregate
          - output
          variable: results
