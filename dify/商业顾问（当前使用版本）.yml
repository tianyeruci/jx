    - data:
        code: "import json\n\n\ndef main(activity_plan: str, primary_query: str, enabled:\
          \ str = 'true') -> dict:\n    try:\n        plan = json.loads(activity_plan)\n\
          \    except (TypeError, ValueError):\n        raise ValueError('Activity\
          \ plan is not valid JSON.')\n    modes = {'recent_list', 'recent_available',\
          \ 'recent_all', 'cancelled', 'postponed', 'completed', 'detail'}\n    if\
          \ not isinstance(plan, dict) or plan.get('mode') not in modes:\n       \
          \ raise ValueError('Activity plan is invalid; this is not an empty retrieval.')\n\
          \    if not isinstance(primary_query, str) or not primary_query.strip():\n\
          \        raise ValueError('Primary activity query is empty.')\n    allowed\
          \ = str(enabled).strip().lower() in {'true', '1', 'yes'}\n    use_supplement\
          \ = allowed and plan['mode'] != 'detail'\n    # One complete alternate expression,\
          \ not one retrieval per keyword. Hard conditions stay in plan.\n    parts\
          \ = []\n    for value in [plan.get('name'), plan.get('city')] + (plan.get('keywords')\
          \ or []):\n        if isinstance(value, str) and value.strip() and value.strip()\
          \ not in parts:\n            parts.append(value.strip())\n    form = {'online':\
          \ '线上', 'offline': '线下', 'hybrid': '线上线下'}.get(plan.get('delivery_mode'),\
          \ '')\n    if form and form not in parts:\n        parts.append(form)\n\
          \    query = ' '.join(parts + ['活动安排与内容介绍'])[:600]\n    if query == primary_query.strip():\n\
          \        query = ' '.join(parts + ['活动时间与适合人群'])[:600]\n    return {\n \
          \       'should_retry': 'true' if use_supplement else 'false',\n       \
          \ 'query': query if use_supplement else '',\n        'diagnostics': json.dumps({\n\
          \            'supplement_used': use_supplement,\n            'reason': 'list_coverage'\
          \ if use_supplement else 'detail_single_query' if allowed else 'disabled',\n\
          \            'mode': plan['mode'], 'primary_query': primary_query,\n   \
          \         'supplement_query': query if use_supplement else '',\n       \
          \     'retrieval_calls': 2 if use_supplement else 1,\n            'policy':\
          \ 'one_parallel_supplement_same_datasets_event_type_original_conditions_postvalidated'\n\
          \        }, ensure_ascii=False)\n    }\n"
        code_language: python3
        desc: 列表至多增加一条完整查询，并与主检索并行；不因已有一场就停止覆盖。具体活动详情不额外检索。
