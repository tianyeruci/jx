          variable: business_output_style
      height: 231
      id: start
      position:
        x: 0
        y: 116
      positionAbsolute:
        x: 0
        y: 116
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import re\n\n\ndef main(query: str) -> dict:\n    raw = str(query or\
          \ \"\").strip()\n    normalized = re.sub(r\"[^0-9a-zA-Z\\u4e00-\\u9fff]\"\
          , \"\", raw.lower())\n\n    def result(should_direct, direct_response=\"\
          \"):\n        return {\n            \"should_direct\": \"true\" if should_direct\
          \ else \"false\",\n            \"direct_response\": direct_response,\n \
          \           \"is_case_request\": \"false\",\n            \"is_activity_request\"\
          : \"false\",\n            \"is_offer_optimization_request\": \"false\",\n\
          \        }\n\n    if not raw:\n        return result(True, \"请告诉我你想分析的经营、营销、产品或管理问题。\"\
          )\n\n    human_terms = (\n        \"转人工\", \"找人工\", \"人工客服\", \"人工咨询\",\
          \ \"联系顾问\", \"找顾问\",\n        \"联系老师\", \"老师微信\", \"顾问微信\", \"客服微信\"\n \
          \   )\n    decline_terms = (\"不用人工\", \"不找人工\", \"不需要人工\", \"无需人工\", \"\
          不要转人工\")\n    if not any(item in raw for item in decline_terms) and (\n\
          \        normalized in {\"人工\", \"老师\", \"顾问\", \"客服\", \"微信\"}\n      \
          \  or any(item in raw for item in human_terms)\n    ):\n        return result(True,\
          \ \"这个问题需要人工顾问进一步确认，请通过页面中的人工咨询入口联系我们。\")\n\n    greetings = {\n       \
          \ \"你好\", \"您好\", \"hi\", \"hello\", \"嗨\", \"哈喽\", \"早上好\", \"下午好\", \"\
          晚上好\",\n        \"你是谁\", \"你能做什么\", \"你会什么\", \"在吗\"\n    }\n    thanks\
          \ = {\"谢谢\", \"感谢\", \"多谢\", \"thankyou\", \"thanks\", \"thx\", \"谢谢你\"\
          , \"非常感谢\"}\n    goodbyes = {\"再见\", \"拜拜\", \"bye\", \"goodbye\", \"下次见\"\
          , \"回头见\", \"先这样\"}\n\n    if normalized in greetings:\n        return result(True,\
          \ \"你好，把你的产品方案、定价、权益或产品文案发给我，给你打磨优化。\")\n    if normalized in thanks:\n\
          \        return result(True, \"不客气。你可以继续告诉我想解决的商业问题。\")\n    if normalized\
          \ in goodbyes:\n        return result(True, \"好的，随时欢迎你再来咨询商业问题。\")\n\n \
          \   # “好的/可以/行/继续”等可能承接上文，不能在这里直接回复。\n    return result(False, \"\")\n"
        code_language: python3
        desc: 仅处理无实质含义的固定问候、感谢、告别和明确人工请求；“好的/继续”等承接表达继续进入上下文意图识别。
        outputs:
          direct_response:
            children: null
            type: string
          is_activity_request:
            children: null
            type: string
          is_case_request:
            children: null
            type: string
          is_offer_optimization_request:
            children: null
            type: string
          should_direct:
            children: null
            type: string
        selected: false
        title: 固定问答与人工请求识别
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
