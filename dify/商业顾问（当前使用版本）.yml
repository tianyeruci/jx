          \        return int(dt.timestamp()) if 1900 <= dt.year <= 2200 else None\n\
          \    except (ValueError, OverflowError, TypeError, OSError):\n        return\
          \ None\n\n\ndef add_months(dt, months):\n    year, zero_month = divmod(dt.year\
          \ * 12 + dt.month - 1 + months, 12)\n    month = zero_month + 1\n    return\
          \ dt.replace(year=year, month=month, day=min(dt.day, calendar.monthrange(year,\
          \ month)[1]))\n\n\ndef small_number(text):\n    if text.isdigit():\n   \
          \     return int(text)\n    digits = {'零': 0, '一': 1, '二': 2, '两': 2, '三':\
          \ 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9}\n    if text in digits:\n\
          \        return digits[text]\n    if text.count('十') == 1:\n        a, b\
          \ = text.split('十')\n        if (not a or a in digits) and (not b or b in\
          \ digits):\n            return (digits.get(a, 1) * 10) + digits.get(b, 0)\n\
          \    return None\n\n\ndef explicit_time(query, mode):\n    \"\"\"仅兜底明确时间表达，不把活动名中的“7天”当筛选窗口，不承担业务意图识别。\"\
          \"\"\n    text = str(query or '')\n    # 更细的日期/时段需由同一次意图模型给出absolute，不能粗糙降成整年、整月或整周。\n\
          \    fine_calendar = (r'(?:今年|明年|去年)\\s*[0-9一二三四五六七八九十]+月|'\n          \
          \           r'(?:下周|上周|本周|这周)[一二三四五六日天]|'\n                     r'(?:下个月|这个月|上个月|本月|下月|上月)\\\
          s*[0-9一二三四五六七八九十]+[日号]|'\n                     r'(?:今天|明天|昨天)(?:上午|下午|晚上|凌晨|中午)|'\n\
          \                     r'(?:本月|下月|上月)(?:底|末|初|最后)')\n    if re.search(fine_calendar,text)\
