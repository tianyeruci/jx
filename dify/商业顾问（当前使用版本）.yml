    - data:
        code: "import json\n\n\ndef main(results, task) -> dict:\n    if not isinstance(results,\
          \ list) or not isinstance(task, dict):\n        raise ValueError('Invalid\
          \ retrieval result/task; retrieval failure is not an empty match.')\n  \
          \  query = task.get('query')\n    if not isinstance(query, str) or not query.strip():\n\
          \        raise ValueError('Retrieval task has no valid query.')\n    tagged\
          \ = []\n    for rank, item in enumerate(results, 1):\n        if not isinstance(item,\
          \ dict):\n            raise ValueError('A retrieval result item is not an\
          \ object.')\n        copy = dict(item)\n        copy['_retrieval'] = {'need_id':\
          \ str(task.get('id', 'main')), 'query': query,\n                       \
          \       'rank': rank, 'is_main': task.get('id') == 'main'}\n        tagged.append(copy)\n\
          \    # JSON inside the shallow task envelope avoids extra nested metadata\
          \ depth in Code outputs.\n    # Empty retrievals retain an explicit completed\
          \ query record, never a fake evidence document.\n    payload = json.dumps(tagged,\
