    - data:
        desc: 保留原有历史和风格输入。普通用法复用conversation_id；只有外部服务换会话时才回传task_state_json。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 历史摘要
          max_length: 12000
          required: false
          type: paragraph
          variable: conversation_summary
        - label: 最近对话
