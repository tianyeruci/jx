    - data:
        desc: AI管理服务每轮注入已验证的上下文和输出风格。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 历史摘要
          max_length: 12000
          required: false
          type: paragraph
          variable: conversation_summary
        - label: 最近对话
          max_length: 24000
          required: false
          type: paragraph
          variable: recent_history_text
        - label: 用户画像JSON
          max_length: 12000
