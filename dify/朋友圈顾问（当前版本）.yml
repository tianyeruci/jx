          \    if start>=0:\n        try:\n            value,_=json.JSONDecoder().raw_decode(raw[start:])\n\
          \            return value if isinstance(value,dict) else {}\n        except\
          \ ValueError:\n            pass\n    return {}\n\nSLOT_SPECS = {\n    'topic':\
          \ ('这条朋友圈想写什么？', '只用现有信息先写，不编造产品细节', '我想介绍一份 WorkBuddy 使用技巧资料。'),\n    'audience':\
          \ ('这条朋友圈主要想让谁感兴趣？', '对这个主题感兴趣的人，不限定职业', '主要给刚开始做自媒体、还不熟悉工具的人看。'),\n   \
          \ 'material': ('有哪些内容需要写进朋友圈？', '只用已经提供的内容，不补写经历或效果', '保留我说的三个用途，没确认的价格和效果先不写。'),\n\
          \    'focus': ('这条朋友圈更想突出什么？', '把已有内容说明白，不夸大效果', '重点讲这份资料怎么用，不要写得像硬广告。')\n\
