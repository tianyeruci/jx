          \ ans\n\ndef parse_selections(text, questions):\n    t=unicodedata.normalize('NFKC',str(text\
          \ or '')).strip()\n    # Structured syntax: 1、A。3、D：补充内容 / 1A 3D / 问题1:\
          \ A.\n    pat=re.compile(r'(?:问题\\s*)?(\\d{1,2})\\s*[、.．:：)）\\-]?\\s*([A-Ea-e])(?=$|[\\\
          s。；;,，：:]|\\d|[^A-Za-z0-9])')\n    matches=list(pat.finditer(t)); answers={};\
          \ warnings=[]\n    if not matches and len(questions)==1 and re.fullmatch(r'[A-Ea-e]',t):\n\
          \        t='1、'+t; matches=list(pat.finditer(t))\n    if not matches:\n\
          \        return answers, False, [], ''\n    extra=t[:matches[0].start()].strip('\
