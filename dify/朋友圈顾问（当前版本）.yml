        code: "import hashlib\nimport json\n\ndef main(batches: list) -> dict:\n \
          \   groups=[]; errors=0; filtered=0\n    for b in batches if isinstance(batches,list)\
          \ else []:\n        if isinstance(b,str):\n            try:b=json.loads(b)\n\
          \            except ValueError:b=None\n        if not isinstance(b,dict):\n\
          \            errors+=1;continue\n        if b.get('status')=='error':errors+=1\n\
          \        rows=[]\n        for d in b.get('documents',[]):\n            if\
          \ not isinstance(d,dict):continue\n            meta=d.get('metadata') if\
          \ isinstance(d.get('metadata'),dict) else {}\n            custom=meta.get('document_metadata')\
          \ if isinstance(meta.get('document_metadata'),dict) else {}\n          \
          \  record_type=meta.get('record_type',custom.get('record_type'))\n     \
          \       if record_type is not None and record_type!='article':\n       \
          \         filtered+=1;continue\n            content=str(d.get('content','')).strip()\n\
          \            if not content:continue\n            # Equal titles can belong\
          \ to distinct documents; do not dedupe by title.\n            ident=[meta.get('dataset_id',''),meta.get('document_id',''),meta.get('segment_id',''),meta.get('version',custom.get('version',''))]\n\
          \            if not ident[2]:ident[2]=hashlib.sha256(content.encode('utf-8')).hexdigest()\n\
          \            key=json.dumps(ident,ensure_ascii=False)\n            rows.append({'key':key,'content':content,'title':str(d.get('title')\
          \ or meta.get('document_name') or ''),\n                'source':{k:meta[k]\
          \ for k in ('dataset_id','document_id','segment_id','document_name','document_metadata')\
          \ if k in meta},\n                'query':str(b.get('query',''))})\n   \
          \     groups.append(rows)\n    # Round-robin preserves candidate coverage\
          \ across independent evidence needs.\n    # Never add heterogeneous vector/BM25\
          \ scores. No semantic completeness claim.\n    chosen=[];seen={};used=0;budget_skipped=0\n\
          \    depth=max((len(g) for g in groups),default=0)\n    for i in range(depth):\n\
          \        for group in groups:\n            if i>=len(group):continue\n \
          \           item=group[i];key=item['key']\n            if key in seen:\n\
          \                target=chosen[seen[key]]\n                if item['query']\
          \ not in target['matched_queries']:target['matched_queries'].append(item['query'])\n\
          \                continue\n            if len(chosen)>=8 or used+len(item['content'])>16000:\n\
          \                budget_skipped+=1;continue\n            seen[key]=len(chosen);used+=len(item['content'])\n\
          \            chosen.append({'id':'E%d'%(len(chosen)+1),'title':item['title'],'content':item['content'],'source':item['source'],'matched_queries':[item['query']]})\n\
          \    status='partial_error' if errors and chosen else 'error' if errors\
          \ else 'ok' if chosen else 'empty'\n    evidence={'status':status,'record_type_filter':'article','query_count':len(groups),'error_count':errors,\n\
          \        'metadata_rejected':filtered,'budget_skipped':budget_skipped,'documents':chosen,\n\
