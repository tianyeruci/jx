          \    return '\\n'.join(rows)\n\ndef defaults(questions, previous=None):\n\
          \    ans=copy.deepcopy(previous or {})\n    for q in questions:\n      \
          \  ans.setdefault(q['slot'], {'value':q['options'][ord(q['default'])-65],\
