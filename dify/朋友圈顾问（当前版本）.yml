          \ = json.loads(x)\n        return value if isinstance(value, dict) else\
          \ {}\n    except (TypeError, ValueError):\n        return {}\n\ndef norm(x):\n\
          \    return re.sub(r'[^0-9a-z\\u4e00-\\u9fff]', '', unicodedata.normalize('NFKC',\
          \ str(x or '')).lower())\n\ndef explicit_route(text):\n    # Only explicit\
          \ writing instructions; not general mentions of sales/products.\n    t =\
          \ str(text or '')\n    rules = [\n        ('polish', r'(?:帮我|请|再|继续|改为|改成|换成)?(?:润色|缩短|精简|扩写|重写|调整排版|重新排版)(?:一下|这|上|原|文|成|点|，|,|：|:|\\\
          s|$)'),\n        ('seeding', r'(?:写|做|改成|换成|改为|要|来).{0,10}(?:种草(?:型)?朋友圈|自然种草|种草文案)'),\n\
          \        ('sales', r'(?:写|做|改成|换成|改为|要|来).{0,10}(?:销售(?:型)?朋友圈|销售文案|促销朋友圈)')\n\
          \    ]\n    hits=[]\n    for route, pat in rules:\n        hits += [(m.start(),\
          \ route) for m in re.finditer(pat,t)]\n    return sorted(hits)[-1][1] if\
