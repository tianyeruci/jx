          \    out.sort(key=lambda q:priority[q['slot']])\n    for i,q in enumerate(out,1):\
          \ q['id']=i\n    return out\n\ndef render_menu(questions):\n    rows=['1、立即生成','按已有内容先写一版，回复“1”即可。','','2、回答下面问题，生成内容更加完善','下面的问题可选答；没有回答的按默认处理。']\n\
          \    for q in questions:\n        rows += ['', '问题%d：%s'%(q['id'],q['question'])]\n\
