          \            chunks.append(cur); cur=''\n        cur+=sentence\n    if cur:\
          \ chunks.append(cur)\n    return '\\n\\n'.join(chunks)\n\n\ndef cleanup(raw,\
          \ ctx):\n    original=raw\n    if ctx.get('preserve_layout') is True: return\
          \ original\n    raw=raw.strip().replace('\\r\\n','\\n').replace('\\r','\\\
          n')\n    if ctx.get('output_format')!='markdown':\n        match=re.fullmatch(r'```(?:text|plaintext|markdown)?\\\
          s*\\n([\\s\\S]*?)\\n```',raw,re.I)\n        if match: raw=match.group(1).strip()\n\
          \        if raw.startswith('\"') and raw.endswith('\"'):\n            try:\n\
          \                decoded=json.loads(raw)\n                if isinstance(decoded,str):\
          \ raw=decoded\n            except ValueError: pass\n        if '\\n' not\
          \ in raw and raw.count('\\\\n')>=2 and not re.search(r'https?://|[A-Z]:\\\
          \\',raw):\n            raw=raw.replace('\\\\n','\\n')\n        raw=re.sub(r'(?m)^#{1,6}\\\
          s+','',raw)\n        raw=re.sub(r'\\*\\*([^*\\n]+)\\*\\*',r'\\1',raw)\n\
          \    raw='\\n'.join(line.rstrip() for line in raw.split('\\n')).strip()\n\
          \    raw=re.sub(r'\\n{3,}','\\n\\n',raw)\n    # Remove only unmistakable\
          \ assistant-service tails, never an audience-facing CTA.\n    paragraphs=raw.split('\\\
          n\\n')\n    tail=re.compile(r'^(?:需要的话[，,]?|如果(?:你)?需要[，,]?|你可以)?(?:我(?:可以|来)|请你|你再).{0,40}(?:帮你填|填具体内容|再帮你(?:改|写)|继续帮你|补充(?:产品|受众|素材)).*[。！!?？]?$',re.S)\n\
          \    if len(paragraphs)>1 and (tail.fullmatch(paragraphs[-1].strip()) or\
