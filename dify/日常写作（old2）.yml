app:
  description: 单对话框连续写作：代码节点仅零模型拦截上下文无关的固定消息；polish/expand 各用一次 qwen-plus 并启用会话记忆。当前消息优先、历史只补缺；必要信息不足才询问；明确数量按当前交付范围严格执行。
  icon: ✍️
  icon_background: '#FCE7F3'
  icon_type: emoji
  mode: advanced-chat
  name: 日常写作
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.0.27@4bb3f3eb6149b01f92aa6038a6bb074cc4224b8c015f54c888e5c5a30fc1ab50
    version: null
kind: app
version: 0.6.0
workflow:
