        y: 132
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import re\n\n\ndef main(query: str, writing_type: str) -> dict:\n \
          \   raw = str(query or \"\").strip()\n    normalized = re.sub(\n       \
          \ r\"[^0-9a-zA-Z\\u4e00-\\u9fff]\",\n        \"\",\n        raw.lower()\n\
          \    )\n\n    def direct(response: str) -> dict:\n        return {\n   \
          \         \"route\": \"direct\",\n            \"direct_response\": response\n\
          \        }\n\n    # 空输入，或只有标点/表情/空白：不进入模型。\n    if not raw or not normalized:\n\
          \        return direct(\"请直接告诉我你想表达什么，或者把需要润色、扩充的内容发给我。\")\n\n    # 只做整句标准化后的精确匹配，避免“你好，帮我改一下……”被误拦截。\n\
          \    greetings = {\n        \"你好\", \"您好\", \"hi\", \"hello\", \"嗨\", \"\
          哈喽\", \"在吗\", \"在不在\",\n        \"早\", \"早安\", \"早上好\", \"午安\", \"下午好\"\
          , \"晚上好\",\n        \"你好在吗\", \"您好在吗\", \"嗨在吗\"\n    }\n\n    capabilities\
          \ = {\n        \"你是谁\", \"你是什么\", \"你能做什么\", \"你会什么\", \"能做什么\",\n     \
          \   \"会做什么\", \"可以做什么\", \"怎么用\", \"如何使用\", \"这是干嘛的\",\n        \"这是做什么的\"\
          , \"help\", \"whatareyou\", \"whatcanyoudo\", \"howtouse\"\n    }\n\n  \
          \  thanks = {\n        \"谢谢\", \"谢谢你\", \"感谢\", \"感谢你\", \"多谢\", \"谢了\"\
          , \"非常感谢\",\n        \"thankyou\", \"thanks\", \"thx\"\n    }\n\n    goodbyes\
          \ = {\n        \"再见\", \"拜拜\", \"bye\", \"goodbye\", \"下次见\", \"回头见\",\n\
          \        \"先这样\", \"先这样吧\", \"好的先这样\", \"好先这样\", \"晚安\"\n    }\n    if normalized\
          \ in greetings:\n        return direct(\"你好，把你想表达的内容、想法或原文直接发给我就可以。我可以帮你润色或扩充成稿。\"\
          )\n\n    if normalized in capabilities:\n        return direct(\"我可以根据你的想法或原文进行润色、扩充，也能结合当前对话继续修改。你直接告诉我想表达什么即可。\"\
          )\n\n    if normalized in thanks:\n        return direct(\"不客气，需要继续调整的话直接告诉我就行。\"\
          )\n\n    if normalized in goodbyes:\n        return direct(\"好的，需要继续写或修改时随时告诉我。\"\
          )\n\n    # “好的 / 可以 / 行 / ok / 嗯 / 收到”等确认短句不在代码层拦截。\n    # 它们可能是在回答上一轮 LLM\
          \ 的必要信息确认（例如“是否分批输出”）；\n    # 代码节点看不到会话上下文，若直接回复会吞掉有效答案，因此交给后续 LLM 结合 Memory\
          \ 判断。\n\n    # 固定消息未命中后，再按程序参数严格路由；不对 type 做容错猜测。\n    writing_type = str(writing_type\
          \ or \"\")\n    if writing_type == \"polish\":\n        return {\"route\"\
          : \"polish\", \"direct_response\": \"\"}\n    if writing_type == \"expand\"\
          :\n        return {\"route\": \"expand\", \"direct_response\": \"\"}\n\n\
          \    return {\"route\": \"invalid\", \"direct_response\": \"\"}\n"
        code_language: python3
        desc: 仅拦截上下文无关且高确定性的空输入、纯问候、能力询问、纯感谢和纯告别；确认/同意类短句可能是上一轮 ASK 的有效回答，必须进入 LLM
          结合会话历史判断。
        outputs:
          direct_response:
            children: null
            type: string
          route:
            children: null
            type: string
        selected: false
        title: 固定消息过滤
        type: code
        variables:
        - value_selector:
          - sys
          - query
          value_type: string
          variable: query
        - value_selector:
          - start
          - type
          value_type: string
          variable: writing_type
      height: 143
      id: fixed_message_filter
      position:
        x: 342
        y: 173
      positionAbsolute:
        x: 342
        y: 173
      sourcePosition: right
      targetPosition: left
      type: custom
