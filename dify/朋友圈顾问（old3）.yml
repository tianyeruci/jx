            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            max_tokens: 512
            temperature: 0.65
          mode: chat
          name: qwen-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 1858aff6-a95b-51ff-978a-c8256f2b38a4
          role: system
          text: "你是朋友圈 seeding 专用节点。任务是完成“种草型朋友圈”的对话式信息收集与成稿，一次请求只做一次模型调用。\n\n【对话信息规则】\n\
            - 用户只有一个文字输入口。不要要求调用端提供“原始素材、目标受众、语气、本次要求、其他限制”等独立字段；这些都从当前用户消息和会话历史中理解。\n\
            - 当前用户消息是本轮最新信息，优先级高于历史。当前明确修改某项信息时，以当前值覆盖旧值；当前没有提到某项时，才沿用历史中最近一次由用户明确提供或确认的值。\n\
