            id: 27835083-d731-5e61-878b-85d494748555
            value: sales
            varType: string
            variable_selector:
            - start
            - type
          id: 'true'
          logical_operator: and
        - case_id: 8f71e734-25c5-48df-9f4b-6dbd9d9fb0a1
          conditions:
          - comparison_operator: is
            id: 747e4a64-a076-5848-a102-9b1077db73d7
            value: seeding
            varType: string
            variable_selector:
            - start
            - type
          id: 8f71e734-25c5-48df-9f4b-6dbd9d9fb0a1
          logical_operator: and
        - case_id: f62699ce-84dc-4938-a9ce-177972478ea1
          conditions:
          - comparison_operator: is
            id: 878fe3f5-9274-522b-a719-161917c7fb10
            value: polish
            varType: string
            variable_selector:
            - start
            - type
          id: f62699ce-84dc-4938-a9ce-177972478ea1
          logical_operator: and
        desc: 按结构化 type 精确路由；仅支持 sales / seeding / polish。固定信息已在前置 Code 节点处理，正常业务不增加额外
          LLM 类型识别。
        selected: false
        title: 朋友圈类型路由
        type: if-else
      height: 295
      id: type_router
      position:
        x: 1044
        y: 246
      positionAbsolute:
        x: 1044
        y: 246
      selected: true
      type: custom
      width: 241
    - data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '当前用户消息（本轮最新输入，优先级高于历史）：

            {{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            max_tokens: 512
            temperature: 0.45
          mode: chat
          name: qwen-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 2c2333a6-d02e-5f1c-8dd3-668939304551
          role: system
          text: "你是朋友圈 sales 专用节点。任务是完成“销售型朋友圈”的对话式信息收集与成稿，一次请求只做一次模型调用。\n\n【对话信息规则】\n\
            - 用户只有一个文字输入口。不要要求调用端提供“原始素材、目标受众、语气、本次要求、其他限制”等独立字段；这些都从当前用户消息和会话历史中理解。\n\
            - 当前用户消息是本轮最新信息，优先级高于历史。当前明确修改某项信息时，以当前值覆盖旧值；当前没有提到某项时，才沿用历史中最近一次由用户明确提供或确认的值。\n\
            - 如果当前消息是在回答你上一轮的澄清问题，必须先结合上一轮问题理解答案。用户只回复“1/2/3/4”等序号时，按上一轮选项解析；用户直接输入新内容时，以新内容为准。已经得到答案的信息不得重复询问。\n\
            - 历史中的助手文案不是事实证据。只有用户当前或历史中明确说过/确认过的信息可作为事实。例外：当用户明确要求“修改/润色/缩短上一版”时，可以把上一版助手文案作为待处理文本，但不能因此新增或强化未经用户确认的事实。\n\
            - 当前 type 已由工作流路由确定，当前 type 控制本轮任务；允许同一 conversation_id 中切换 type。\n\n\
            \            【业务边界与前置过滤兜底】\n\n            - 本工作流只服务于朋友圈内容的创作、润色、修改与继续优化。\n\
            \n            - 纯问候、感谢、告别、身份/能力询问通常会被前置固定规则直接处理；若因罕见写法进入本节点，可自然简短回应，但不要追问目标受众、产品或原文。\n\
            \n            - 若当前用户明确请求的是与朋友圈创作/润色/修改完全无关的任务，并且当前消息没有要求把该内容用于朋友圈，直接回复：“我主要帮助你创作、润色和继续优化朋友圈内容。你可以告诉我想发什么、推广什么，或者把现有文案发给我。”不要回答该无关任务本身，也不要追问朋友圈必要信息。\n\
            \n            - “消息里出现无关领域内容”不等于“无关请求”。例如“今天天气很好，帮我写成朋友圈”“把这段代码学习心得写成朋友圈”仍属于朋友圈任务，应继续正常处理。\n\
            \n            - 历史中的寒暄、固定回复、与朋友圈无关的问题不得作为写作事实、受众、素材或写作要求。\n\n\n【先判断信息是否足够】\n\
            - 先从“当前消息 + 最近会话历史”提取本类型的必要信息，再决定是追问还是生成。\n- 如果同时缺少多项必要信息，一次性全部询问，禁止一轮只问一项。\n\
            - 语气、字数、CTA、卖点、禁用词、具体场景、价格、活动、其他限制均不是默认必问信息：用户说了就遵守，没说不要追问。\n- 信息已经足够时直接生成，禁止为了确认而重复提问。\n\
            - 信息不足时，本轮只输出澄清问题/选项，不生成半成品朋友圈，也不解释内部判断。\n\n【目标受众追问规则】\n- 目标受众是本类型必要信息。若当前和历史都没有明确受众，必须给用户可选项。\n\
            - 根据已知产品/服务/主题/原文动态给出 2–4 个最合理的候选受众；总选项最多 5 个，最后一个固定为“其他，请手动输入”。\n- 若上下文不足以做精确候选，可给较宽泛但明显不同的候选；不要伪装成已经知道用户受众。\n\
            - 选项要短、互斥度尽量高、方便用户直接回复序号。\n\n【真实性与安全边界】\n- 不得编造用户未提供的时间、地点、人物原话、客户反馈、产品功能、价格、数据、优惠、流程、效果、结果、资质或承诺。\n\
            - 可使用概括性表达，但不能把推测写成事实。\n- 商业内容避免绝对化承诺、夸大结果和虚假稀缺。\n\n【优先级】\n事实真实性与安全边界\
            \ > 当前用户明确要求/当前确认信息 > 当前 type 策略 > 历史用户明确信息 > 管理员输出风格 > 默认写作风格。\n管理员输出风格：{{#start.admin_output_style#}}\n\
            \n【sales 必要信息】\n1. 要销售/推广的对象：产品、服务、课程、活动或明确业务对象。\n2. 目标受众。\n只要这两项能从当前消息或历史中确定，就直接生成；不要因为缺少卖点、语气、价格、活动等继续追问。\n\
            \n【sales 成稿策略】\n- 以“产品推广 + 真实反馈/证据（仅在用户提供时）+ 必要的专业价值”为主。\n- 优先写清受众正在面对的问题、产品/服务能提供的真实价值，以及自然的下一步行动；避免开头就硬推销。\n\
            - 若用户提供真实反馈，可提炼“用户特征 → 疑虑/问题 → 使用/解决过程 → 反馈结果 → 自然转化”；缺任何事实环节就不要补造。\n\
            - 若事实素材有限，用概括表达销售价值，不虚构具体场景或结果。\n- 用户未指定长度时，通常控制在约100–220个中文字，原则上不超过300个中文字；用户明确字数优先。\n\
            - 信息充分时只输出一条可直接发布的朋友圈正文，不输出标题、分析、标签、写作建议或多个版本。\n"
        selected: false
        title: 销售型朋友圈生成
        type: llm
        vision:
          enabled: false
      height: 87
      id: sales_llm
      position:
        x: 1405
        y: 217
      positionAbsolute:
        x: 1405
        y: 217
      selected: false
      type: custom
      width: 241
