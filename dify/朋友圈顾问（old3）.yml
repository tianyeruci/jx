      width: 242
    - data:
        code: "import re\n\n\ndef main(query: str) -> dict:\n    raw = str(query or\
          \ \"\").strip()\n\n    if not raw:\n        return {\n            \"should_direct\"\
          : \"true\",\n            \"direct_response\": \"请告诉我你想写什么朋友圈，或者把需要润色的内容直接发给我。\"\
          ,\n        }\n\n    # 统一大小写并移除空白/标点，只对整句做高确定性匹配。\n    # 因此“你好”会命中，但“你好，帮我写朋友圈”不会被误拦截。\n\
          \    normalized = re.sub(r\"[^0-9a-zA-Z\\u4e00-\\u9fff]\", \"\", raw.lower())\n\
          \n    # 兼容“你好呀 / 谢谢啦”等常见结尾语气词。\n    base = normalized\n    if len(base)\
          \ > 1 and base[-1] in {\"呀\", \"啊\", \"呢\", \"啦\", \"哦\", \"哈\", \"嘛\"}:\n\
          \        base = base[:-1]\n\n    greetings = {\n        \"你好\", \"您好\",\
          \ \"嗨\", \"哈喽\", \"哈啰\", \"在吗\", \"在不在\", \"有人吗\",\n        \"早上好\", \"\
          上午好\", \"中午好\", \"下午好\", \"晚上好\", \"hi\", \"hello\",\n    }\n    capabilities\
          \ = {\n        \"你是谁\", \"你是干什么的\", \"你能做什么\", \"你会什么\", \"你能干什么\",\n  \
          \      \"能做什么\", \"能干什么\", \"介绍一下你自己\", \"介绍下你自己\",\n    }\n    thanks =\
          \ {\n        \"谢谢\", \"谢谢你\", \"非常感谢\", \"感谢\", \"多谢\", \"thanks\", \"thx\"\
          , \"thankyou\",\n    }\n    goodbyes = {\n        \"再见\", \"拜拜\", \"下次见\"\
          , \"回头见\", \"先这样\", \"bye\", \"goodbye\",\n    }\n\n    direct_groups =\
          \ (\n        (greetings, \"你好，我可以帮你写销售型、种草型朋友圈，也可以润色已有文案。直接告诉我你想写什么即可。\"\
          ),\n        (capabilities, \"我是朋友圈写作助手，可以帮你写销售型、种草型朋友圈，也可以润色和继续优化已有文案。直接告诉我你的需求即可。\"\
          ),\n        (thanks, \"不客气。你可以继续告诉我想怎么调整，或者直接开始下一条朋友圈。\"),\n        (goodbyes,\
          \ \"好的，需要写或修改朋友圈时随时告诉我。\"),\n    )\n\n    for terms, response in direct_groups:\n\
          \        if base in terms:\n            return {\n                \"should_direct\"\
          : \"true\",\n                \"direct_response\": response,\n          \
          \  }\n\n    return {\n        \"should_direct\": \"false\",\n        \"\
          direct_response\": \"\",\n    }\n"
        code_language: python3
        dependencies: []
        desc: 仅处理空输入、问候、能力询问、感谢和告别等高确定性固定语句。整句归一化匹配，混合业务消息不会被截断。
        outputs:
          direct_response:
            children: null
            type: string
          should_direct:
            children: null
            type: string
        selected: false
        title: 固定信息过滤
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
