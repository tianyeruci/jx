app:
  description: 单入口朋友圈助手：先以无模型固定规则处理高确定性寒暄，再按 type 路由；基于 conversation_id 最近6轮对话自动提取必要信息，信息不足一次询问，信息充分直接成稿。
  icon: 💬
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: 朋友圈顾问
  use_icon_as_answer_icon: false
