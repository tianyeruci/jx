          \   活动状态或时间尚无法可靠确认，不提供可报名结论。')\n            elif e['end'] is not None and\
          \ e['end'] < now:\n                lines.append('   已超过资料记录的活动结束时间，不应视为可报名活动。')\n\
          \            else:\n                lines.append('   '+registration_label(rs,re_,state))\n\
          \        if mode == 'detail':\n            form = {'online':'线上','offline':'线下','hybrid':'线上及线下'}.get(str(md.get('delivery_mode')\
          \ or ''),'')\n            fields = body_fields(e['item'])\n            city\
