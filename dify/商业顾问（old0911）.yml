    - data:
        code: "import json\nimport re\n\n\ndef as_dict(value):\n    if isinstance(value,\
          \ str):\n        try:\n            value = json.loads(value)\n        except\
          \ (ValueError, TypeError):\n            return {}\n    if isinstance(value,\
          \ list):\n        return {str(x['name']):x.get('value') for x in value if\
          \ isinstance(x,dict) and isinstance(x.get('name'), str)}\n    return value\
          \ if isinstance(value, dict) else {}\n\n\ndef metadata_of(item):\n    if\
          \ not isinstance(item, dict):\n        return {}\n    outer = as_dict(item.get('metadata'))\n\
          \    # 兼容受控的几种返回包装；不从正文猜测业务 metadata。\n    output = dict(outer)\n    output.update(as_dict(item.get('doc_metadata')))\n\
          \    output.update(as_dict(outer.get('doc_metadata')))\n    return output\n\
          \n\ndef normalized(value):\n    return ''.join(ch for ch in str(value or\
          \ '').casefold() if ch.isalnum())\n\n\ndef public_text(value, limit=500):\n\
          \    if not isinstance(value, str):\n        return ''\n    # 脱敏占位符不能被误展示成真实简介或活动名。\n\
          \    if '<redacted' in value.casefold():\n        return ''\n    return\
          \ value.replace('\\x00', '').strip()[:limit]\n\nimport hashlib\n\nMETHOD_TYPES\
          \ = {'methodology','methodology_candidate','validated_universal_methodology'}\n\
          \n\ndef safe_body(text):\n    if not isinstance(text,str):\n        return\
          \ ''\n    # 仅去掉技术标识和“检索问法”区，不凭规则改写业务事实。\n    text = re.sub(r'\\b(?:case|evt)_[A-Za-z0-9_<>-]+',\
          \ '[内部标识已隐藏]', text)\n    text = re.sub(r'^#\\s*匿名商业案例[^\\n]*', '# 匿名商业案例',\
          \ text, flags=re.M)\n    text = re.split(r'^##\\s*常见相似案例问法\\s*$', text,\
          \ maxsplit=1, flags=re.M)[0]\n    return text.replace('\\x00','').strip()\n\
          \n\ndef prepare_evidence(items, scope):\n    output, seen = [],set()\n \
          \   counts = {'input':len(items) if isinstance(items,list) else 0,'empty_body':0,'scope_rejected':0,'duplicates':0}\n\
          \    for item in items if isinstance(items,list) else []:\n        if not\
          \ isinstance(item,dict):\n            counts['empty_body'] += 1\n      \
          \      continue\n        md = metadata_of(item)\n        raw_kind = md.get('record_type')\n\
          \        kind = raw_kind if isinstance(raw_kind,str) else None\n       \
          \ allowed = (kind is None or kind == '' or\n                   (scope ==\
          \ 'method' and kind in METHOD_TYPES) or\n                   (scope == 'case'\
          \ and kind == 'consulting_case') or\n                   (scope == 'general'\
          \ and kind not in {'event','consulting_case'}))\n        if not allowed:\n\
          \            counts['scope_rejected'] += 1\n            continue\n     \
          \   body = safe_body(item.get('content'))\n        if not body:\n      \
          \      counts['empty_body'] += 1\n            continue\n        fingerprint\
          \ = hashlib.sha256(body.encode()).hexdigest()\n        if fingerprint in\
          \ seen:\n            counts['duplicates'] += 1\n            continue\n \
          \       seen.add(fingerprint)\n        if kind == 'methodology_candidate':\n\
          \            grade = '候选做法：可参考，未经跨来源验证，不能称为通用结论'\n        elif kind == 'validated_universal_methodology':\n\
          \            grade = '库内标记为已通过Registry晋升；不等于独立外部验证或对所有场景成立'\n        elif\
          \ kind == 'methodology':\n            grade = '方法论资料：验证等级未提供'\n        elif\
          \ kind == 'consulting_case' or scope == 'case':\n            grade = '咨询记录：不预设有处理方案，更不预设已经执行或取得成功'\n\
          \        else:\n            grade = '参考资料：验证等级未提供'\n        record = {'record_type':kind\
          \ if isinstance(kind,str) else 'unknown', 'retrieval_scope':scope,\n   \
          \               'evidence_level':grade, 'content':body}\n        topic =\
          \ public_text(md.get('topic'),120)\n        if topic:\n            record['topic']\
          \ = topic\n        if kind == 'consulting_case' or scope == 'case':\n  \
          \          record['advice_in_excerpt'] = bool(re.search(r'^##\\s*该案例中的处理思路[^\\\
          n]*\\n\\s*\\S',body,re.M))\n            record['result_boundary'] = 'metadata不能证明实施结果；建议、计划、“可结合”、预计改善均不得改写成已发生的结果。'\n\
          \        output.append(record)\n    return output,counts\n\n\ndef compact(records,\
          \ max_chars=12000):\n    records = records[:8]\n    if not records:\n  \
          \      return ''\n    # 平均分配容量，避免首条长正文吃满预算导致并行的另一类证据完全消失。\n    per_record\
          \ = max_chars // len(records) - 2\n    lines = []\n    for index,record\
          \ in enumerate(records,1):\n        copy = dict(record)\n        body =\
          \ copy.pop('content')\n        copy['evidence_no'] = index\n        copy['truncated']\
          \ = False\n        overhead = len(json.dumps({**copy,'content':''},ensure_ascii=False,separators=(',',':')))\n\
          \        budget = max(0,per_record-overhead-30)\n        selected = body[:budget]\n\
          \        copy['truncated'] = len(selected) < len(body)\n        copy['content']\
          \ = selected\n        line = json.dumps(copy,ensure_ascii=False,separators=(',',':'))\n\
          \        # 引号和换行会增加JSON长度；按序列化后的长度二次收紧。\n        while len(line) > per_record\
          \ and copy['content']:\n            copy['content'] = copy['content'][:max(0,len(copy['content'])-(len(line)-per_record)-5)]\n\
          \            copy['truncated'] = True\n            line = json.dumps(copy,ensure_ascii=False,separators=(',',':'))\n\
          \        lines.append(line)\n    return '\\n'.join(lines)\n\ndef main(results,\
          \ primary_intent: str) -> dict:\n    records,counts = prepare_evidence(results,'case'\
          \ if primary_intent == 'case' else 'general')\n    text = compact(records)\n\
          \    return {'evidence_text':text,'has_evidence':'true' if text else 'false',\n\
          \            'diagnostics':json.dumps({**counts,'retained':len(records[:8])},ensure_ascii=False)}\n"
