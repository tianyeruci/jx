          \    if e['conflict']:\n            lines.append('   同一活动的记录存在冲突，最新日期和状态待核实；不提供可报名结论。')\n\
          \        if e['invalid']:\n            lines.append('   活动时间字段异常，请核实具体时间。')\n\
          \        rs,re_,state = signup_info(md,now)\n        if mode in {'recent_available','detail'}:\n\
          \            if e['status'] in {'cancelled','completed'}:\n            \
          \    lines.append('   活动已取消或已完成，不可报名。')\n            elif e['conflict']\
