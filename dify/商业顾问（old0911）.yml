    - data:
        code: "import calendar\nimport math\nimport re\nfrom datetime import datetime,\
          \ timezone, timedelta\n\nTZ = timezone(timedelta(hours=8))\n\n\ndef stamp(value,\
          \ end_of_day=False):\n    \"\"\"生产字段为 Unix 秒；兼容常见导入格式，但无效/布尔/非有限值不猜测。\"\"\
          \"\n    if value is None or isinstance(value, (bool, dict, list)):\n   \
          \     return None\n    text = str(value).strip()\n    if not text or text.lower()\
          \ in {'none', 'null', 'nan', 'inf', '-inf'}:\n        return None\n    try:\n\
          \        if re.fullmatch(r'\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}', text):\n   \
          \         year, month, day = map(int, re.split('[-/]', text))\n        \
          \    dt = datetime(year, month, day, tzinfo=TZ)\n            if end_of_day:\n\
          \                dt += timedelta(days=1, seconds=-1)\n            return\
          \ int(dt.timestamp()) if 1900 <= year <= 2200 else None\n        chinese\
          \ = re.fullmatch(r'(\\d{4})年(\\d{1,2})月(\\d{1,2})日(?:\\s*(\\d{1,2}):(\\\
          d{2})(?::(\\d{2}))?)?', text)\n        if chinese:\n            y, m, d,\
          \ hh, mm, ss = chinese.groups()\n            dt = datetime(int(y), int(m),\
          \ int(d), int(hh or 0), int(mm or 0), int(ss or 0), tzinfo=TZ)\n       \
          \     if end_of_day and hh is None:\n                dt += timedelta(days=1,\
          \ seconds=-1)\n            return int(dt.timestamp()) if 1900 <= int(y)\
          \ <= 2200 else None\n        if re.fullmatch(r'[+-]?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\\
          d+)?', text):\n            num = float(text)\n            if not math.isfinite(num)\
