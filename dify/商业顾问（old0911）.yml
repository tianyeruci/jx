          \ x in [form,city] if x))\n            summary = fields.get('活动内容') or public_text(md.get('activity_summary'),600)\n\
          \            if summary:\n                lines.append('   简介：'+summary)\n\
          \            price = fields.get('活动费用') or fields.get('费用') or fields.get('价格')\n\
          \            if price:\n                lines.append('   资料标注费用：'+price)\n\
          \            elif any(word in str(plan.get('request_text') or '') for word\
          \ in ('多少钱','费用','收费','价格')):\n                lines.append('   当前资料未提供可单独核实的费用字段；不能猜测收费金额。')\n\
          \        if mode == 'detail' or plan.get('need_links'):\n            link\
          \ = safe_link(md.get('registration_url'))\n            if link and not e['conflict']\
          \ and not e['invalid'] and e['status'] in {'normal','postponed'} and state\
          \ not in {'closed','invalid'} and (e['end'] is None or e['end'] >= now):\n\
          \                lines.append('   资料所附报名页面'+('（开放状态待核实）' if state == 'unknown'\
          \ else '')+'：'+link)\n            elif not link:\n                lines.append('\
          \   资料未提供有效报名链接。')\n    if mode != 'detail':\n        if metrics['retrieved']\
          \ >= 50:\n            lines.append('候选结果达到检索上限，可能未覆盖全部活动，请缩小时间或主题。')\n \
          \       if metrics['version_conflicts']:\n            lines.append('另有活动记录存在版本冲突，未将其列为可确认的结果。')\n\
          \    return finish('\\n'.join(lines))\n"
