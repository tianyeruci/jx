    - data:
        code: "import re\nfrom datetime import datetime, timezone, timedelta\n\n\n\
          def main(query: str) -> dict:\n    now = datetime.now(timezone(timedelta(hours=8)))\n\
          \    raw = str(query or '').strip()\n    text = re.sub(r'[^0-9a-zA-Z\\u4e00-\\\
          u9fff]', '', raw.lower())\n    response = ''\n    if not raw:\n        response\
          \ = '请告诉我你想查询的活动，或想分析的产品、营销、经营问题。'\n    elif text in {'你好', '您好', 'hi',\
          \ 'hello', '嗨', '哈喽', '早上好', '下午好', '晚上好', '你是谁', '你能做什么', '在吗'}:\n    \
          \    response = '你好，把你的产品方案、定价、权益或产品文案发给我，给你打磨优化。'\n    elif text in {'谢谢',\
          \ '感谢', '多谢', '谢谢你', '非常感谢', 'thanks', 'thankyou', 'thx'}:\n        response\
          \ = '不客气。你可以继续告诉我想解决的商业问题。'\n    elif text in {'再见', '拜拜', 'bye', 'goodbye',\
          \ '下次见', '回头见'}:\n        response = '好的，随时欢迎你再来咨询商业问题。'\n    elif re.fullmatch(r'(?:请|请帮我|帮我|麻烦|我要|我想)?(?:转人工|找人工|联系人工|人工客服|人工咨询|联系顾问|找顾问|联系老师|老师微信|顾问微信|客服微信|人工)(?:吧|一下|谢谢)?',\
          \ text):\n        response = '请通过页面中的人工咨询入口联系我们。'\n    # 不用关键词子串截断“人工客服成本怎么优化”；“好的/老师/微信/继续”等进入语义识别。\n\
          \    return {\n        'should_direct': 'true' if response else 'false',\n\
          \        'direct_response': response,\n        'now_ts': int(now.timestamp()),\n\
          \        'current_time': now.isoformat(timespec='seconds'),\n    }\n"
        code_language: python3
        desc: 精确固定问答；为整轮提供同一个北京时间。业务含义和指代交给统一意图模型。
        outputs:
          current_time:
            children: null
            type: string
          direct_response:
            children: null
            type: string
          now_ts:
            children: null
            type: number
          should_direct:
            children: null
            type: string
        selected: false
        title: 固定问答与人工请求识别
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
