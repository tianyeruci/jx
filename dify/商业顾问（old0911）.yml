        desc: 使用原始问题+真实意图+双方上下文+分级证据；不强制固定八段或编造案例结果。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
