services:
  api:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    build:
      context: .
      dockerfile: Dockerfile.offline
    env_file: .env
    command: uvicorn ai_management.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${AI_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      dify:
        aliases:
          - ai-management-api
    restart: unless-stopped

  worker:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    build:
      context: .
      dockerfile: Dockerfile.offline
    env_file: .env
    command: celery -A ai_management.tasks.celery_app worker -l INFO -Q ai_default,ai_cleaning --concurrency=4
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      - dify
    restart: unless-stopped

  scheduler:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    build:
      context: .
      dockerfile: Dockerfile.offline
    env_file: .env
    command: celery -A ai_management.tasks.celery_app beat -l INFO
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      - dify
    restart: unless-stopped

volumes:
  ai_uploads:
  # Historical standalone volumes stay declared as protected rollback evidence.
  # They are intentionally no longer mounted by the running AI services.
  ai_postgres_data:
  ai_redis_data:

networks:
  dify:
    external: true
    name: docker_default
