services:
  api:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    build:
      context: .
      dockerfile: Dockerfile.offline
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    command: uvicorn ai_management.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${AI_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ai_uploads:/app/var/uploads
      - ${CONVERSION_MARKDOWN_HOST_ROOT:-./var/conversion-markdown}:/app/var/conversion-markdown
    networks:
      dify:
        aliases:
          - ai-management-api
    restart: unless-stopped

  worker:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    build:
      context: .
      dockerfile: Dockerfile.offline
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    command: celery -A ai_management.tasks.celery_app worker -l INFO -Q ai_default,ai_cleaning --concurrency=${CLEANING_WORKER_CONCURRENCY:-4}
    volumes:
      - ai_uploads:/app/var/uploads
      - ${CONVERSION_MARKDOWN_HOST_ROOT:-./var/conversion-markdown}:/app/var/conversion-markdown
    networks:
      - dify
    restart: unless-stopped

  ai-ocr-worker:
    image: ${AI_OCR_IMAGE:-jx-now-ai-management-ocr:rapidocr}
    env_file: .env
    entrypoint: ["/app/scripts/ocr_worker_entrypoint.sh"]
    command: celery -A ai_management.tasks.celery_app worker -l INFO -Q ai_ocr --concurrency=1 --prefetch-multiplier=1 --hostname=ai-ocr@%h
    environment:
      HOME: /app
      RAPIDOCR_DISABLE_NETWORK: "1"
      OMP_NUM_THREADS: ${PDF_OCR_CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${PDF_OCR_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${PDF_OCR_CPU_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${PDF_OCR_CPU_THREADS:-2}
    volumes:
      - ai_uploads:/app/var/uploads
      - ${CONVERSION_MARKDOWN_HOST_ROOT:-./var/conversion-markdown}:/app/var/conversion-markdown
    networks:
      - dify
    hostname: jx-ai-ocr-worker
    init: true
    cpus: "2.0"
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Do not bind an assumed host partition here.  On cgroup v2 hosts Docker
    # may reject a partition's major:minor in io.max and prevent the worker
    # from starting.  CPU/memory/pids limits plus jx_resource_guard provide the
    # portable protection; host-specific I/O throttling remains an explicit
    # operator override outside the default Compose contract.
    stop_grace_period: 660s
    restart: "no"

  model-realtime-worker:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    env_file: .env
    command: celery -A ai_management.tasks.celery_app worker -l INFO -Q ai_model_realtime --concurrency=4
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      - dify
    restart: unless-stopped

  model-batch-worker:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    env_file: .env
    command: celery -A ai_management.tasks.celery_app worker -l INFO -Q ai_model_batch --concurrency=1
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      - dify
    restart: unless-stopped

  publication-worker:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    env_file: .env
    command: celery -A ai_management.tasks.celery_app worker -l INFO -Q ai_publication --concurrency=1
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      - dify
    restart: unless-stopped

  scheduler:
    image: ${AI_IMAGE:-jx-now-ai-management:0.2.1}
    build:
      context: .
      dockerfile: Dockerfile.offline
    env_file: .env
    command: celery -A ai_management.tasks.celery_app beat -l INFO
    volumes:
      - ai_uploads:/app/var/uploads
    networks:
      - dify
    restart: unless-stopped

volumes:
  ai_uploads:
  # Historical standalone volumes stay declared as protected rollback evidence.
  # They are intentionally no longer mounted by the running AI services.
  ai_postgres_data:
  ai_redis_data:

networks:
  dify:
    external: true
    name: docker_default
